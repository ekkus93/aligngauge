[advisories]
# Vulnerability, unsoundness, and notice advisories remain fatal. Unmaintained
# informational advisories are fatal for direct workspace dependencies; transitive
# maintenance debt is still reported and must be documented in release evidence.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are private (`publish = false`), so versionless path dependencies
# are allowed while wildcard registry/git dependencies remain denied.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
