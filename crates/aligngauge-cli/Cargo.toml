[package]
name = "aligngauge-cli"
version = "0.0.0"
description = "Command-line interface for AlignGauge"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The v0.1 release CLI composes M4 counters and M5 coverage over one BAM reader while retaining the legacy probe.
[dependencies]
aligngauge-core = { path = "../aligngauge-core" }
aligngauge-coverage = { path = "../aligngauge-coverage" }
aligngauge-hts = { path = "../aligngauge-hts" }
aligngauge-metrics = { path = "../aligngauge-metrics" }

[dev-dependencies]
rust-htslib = { version = "1.0.1", default-features = false }

[[bin]]
name = "aligngauge"
path = "src/main.rs"

[lints]
workspace = true
