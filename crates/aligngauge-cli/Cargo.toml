[package]
name = "aligngauge-cli"
version = "0.0.0"
description = "Command-line interface for AlignGauge"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# v0.1 composes M4 counters and M5 coverage over one BAM traversal; legacy and differential probes remain explicit compatibility paths.
[dependencies]
aligngauge-core = { path = "../aligngauge-core" }
aligngauge-coverage = { path = "../aligngauge-coverage" }
aligngauge-hts = { path = "../aligngauge-hts" }
aligngauge-metrics = { path = "../aligngauge-metrics" }

[dev-dependencies]
aligngauge-testkit = { path = "../aligngauge-testkit" }
rust-htslib = { version = "=1.0.1", default-features = false, features = ["bzip2", "lzma"] }

[[bin]]
name = "aligngauge"
path = "src/main.rs"

[lints]
workspace = true
