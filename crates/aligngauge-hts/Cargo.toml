[package]
name = "aligngauge-hts"
version = "0.0.0"
description = "Validated BAM/CRAM input boundary for AlignGauge"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aligngauge-core = { path = "../aligngauge-core" }
aligngauge-hts-ffi = { path = "../aligngauge-hts-ffi" }
flate2 = "1.1"
md-5 = "=0.10.6"
rust-htslib = { version = "=1.0.1", default-features = false, features = ["bzip2", "lzma"] }
sha2 = "0.10"

[dev-dependencies]
aligngauge-testkit = { path = "../aligngauge-testkit" }

[lints]
workspace = true
