[workspace]
members = [
    "crates/aligngauge-cli",
    "crates/aligngauge-core",
    "crates/aligngauge-coverage",
    "crates/aligngauge-hts",
    "crates/aligngauge-metrics",
    "crates/aligngauge-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/ekkus93/aligngauge"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
