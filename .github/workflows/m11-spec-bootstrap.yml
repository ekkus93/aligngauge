name: M11 Spec Bootstrap

on:
  push:
    branches:
      - milestone-11-picard-profiles
    paths:
      - .github/workflows/m11-spec-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch normative M11 spec and status
        run: python3 scripts/m11_spec_bootstrap.py
      - name: Verify docs diff
        run: |
          set -euo pipefail
          git diff --check
          git diff -- docs/DNA_QC_ENGINE_SPEC.md docs/DNA_QC_ENGINE_TODO.md
      - name: Commit normative bootstrap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DNA_QC_ENGINE_SPEC.md docs/DNA_QC_ENGINE_TODO.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: specify Milestone 11 Picard profiles'
          git push origin HEAD:milestone-11-picard-profiles
