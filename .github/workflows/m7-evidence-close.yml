name: M7 evidence assembly

on:
  push:
    branches: [milestone-7-cram]
    paths:
      - .github/workflows/m7-evidence-close.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Write Milestone 7 evidence and reconcile TODO
        shell: bash
        run: |
          set -euo pipefail
          test ! -e docs/evidence/V0_2_CRAM_VALIDATION.md
          cat > docs/evidence/V0_2_CRAM_VALIDATION.md <<'EOF'
          # v0.2 CRAM validation evidence

          **Milestone:** 7 — CRAM local-reference design  
          **Evidence date:** 2026-08-07  
          **Validated implementation SHA:** `cf288efe8ffdc3542abedc95404bc6602515da4a`  
          **Disposition:** Milestone 7 implementation tasks 7.1–7.4 are complete. This document does **not** declare the v0.2 release gate closed.

          ## 1. Validation summary

          The validated implementation adds CRAM to the existing release analysis path while preserving the v0.1 BAM parser/publication structure. CRAM is accepted only with an explicit local FASTA. AlignGauge independently validates the selected FASTA against CRAM `@SQ` identity before record traversal, then passes that exact path to the pinned HTSlib reader.

          The validated SHA passed all three standing pull-request suites:

          | Gate | Run | Job | Result |
          | --- | --- | --- | --- |
          | Permanent CI | `31184689945` | `92886187241` | success |
          | Full Runtime Validation | `31184688346` | `92886217801` | success |
          | Reference Validation | `31184688367` | `92886248460` | success |

          Permanent CI on that SHA passed formatting, strict Clippy, the complete workspace test suite, documentation, clean-tree verification, the HTSlib network-feature exclusion check, and the network-disabled CRAM reference-isolation proof.

          ## 2. Pinned backend and reference-provider audit

          Production CRAM support is pinned to:

          - `rust-htslib = 1.0.1`;
          - `hts-sys = 2.2.1`;
          - vendored HTSlib source line `1.19.1`.

          `crates/aligngauge-hts/Cargo.toml` disables `rust-htslib` default features and enables only the CRAM codec dependencies `bzip2` and `lzma`. The production dependency graph does not enable `curl`, `s3`, or `gcs`, and Permanent CI fails if `curl-sys` appears or if the relevant network features are enabled.

          `docs/ADR-0004-CRAM_REFERENCE_RESOLUTION.md` records the audited provider surface: explicit FASTA, `REF_CACHE`, `REF_PATH`, MD5 lookup fallback behavior, `@SQ UR`-style locations where applicable, and plugin discovery through `HTS_PATH`. It also records the older HTSlib behavior under which insufficient `REF_PATH` configuration could lead to remote EBI CRAM reference lookup.

          This build-time removal of network transports is the primary HTTP/HTTPS prohibition. It does not depend on DNS state, a remote service being unavailable, or a runtime best-effort flag.

          ## 3. Explicit local-reference resolver

          The CRAM release path requires an explicit `--reference <FASTA>` / API reference argument. A CRAM without a reference fails with `reference_required` even if generic HTSlib behavior could otherwise obtain sequence material from an inherited cache or provider.

          Before reference-dependent record decoding, `crates/aligngauge-hts/src/reference.rs` streams the selected FASTA and validates CRAM-header requirements:

          - exact contig name (`SN`);
          - exact normalized sequence length (`LN`);
          - SAM-style normalized sequence MD5 against `M5` when present;
          - duplicate FASTA names are rejected;
          - missing required sequence is `reference_required`;
          - length or MD5 mismatch is `reference_mismatch`.

          Mismatch is terminal. AlignGauge does not retry with `REF_CACHE`, `REF_PATH`, `UR`, plugins, or a remote provider. Only after independent validation succeeds does `BamReader::open_cram` call `Reader::set_reference` with the already-validated local path.

          ## 4. Inherited environment neutralization

          The original TODO wording said to override inherited reference environment before opening CRAM. ADR-0004 deliberately avoids process-global environment mutation because it is unsafe/racy in a multi-thread-capable Rust process.

          The implemented scoped policy makes inherited provider state non-authoritative instead:

          1. HTSlib network transports are absent from the production build.
          2. CRAM requires an explicit local FASTA.
          3. AlignGauge validates that FASTA independently before traversal.
          4. Only the validated path is supplied through `set_reference`.
          5. Any mismatch is terminal.
          6. Tests inject hostile `REF_PATH`, `REF_CACHE`, and `HTS_PATH` values and require the explicit local reference to remain authoritative.

          This satisfies the security intent without mutating process-global state. The literal wording difference from SPEC §8 is recorded as an open release-scope reconciliation item below rather than hidden.

          ## 5. Reference provenance

          CRAM provenance records the actual local reference identity, not merely the requested configuration:

          - local FASTA path;
          - exact FASTA byte size;
          - SHA-256 of the FASTA file;
          - required contigs in CRAM-header order;
          - normalized per-contig length;
          - normalized per-contig MD5.

          Provenance also records input format, pinned backend versions, BAM/CRAM/alignment traversal counts, and `htslib_network_transport_enabled = false`.

          ## 6. Deterministic BAM/CRAM equivalence

          `crates/aligngauge-cli/tests/cram_v0_2.rs` constructs one deterministic record set, serializes it as BAM, and writes an equivalent CRAM using the explicit local reference. The equivalence test requires:

          - format detection to identify BAM and CRAM correctly;
          - canonical counters to be identical;
          - canonical coverage to be identical;
          - the complete canonical summary to be identical;
          - header identity, backend versions, resource limits, normalization actions, warnings, and system provenance to agree;
          - analysis-plan equality after removing only the explicitly format/reference-specific keys (`input_format`, BAM/CRAM traversal counters, and `local_reference`).

          No blanket tolerance or format-specific alternate collector is used. BAM and CRAM share the validated record/collector path.

          ## 7. Missing, mismatched, truncated, and corrupt CRAM behavior

          The CRAM integration suite proves:

          - no explicit FASTA -> `reference_required`;
          - required contig absent -> `reference_required`, with the contig and expected M5 in the diagnostic;
          - wrong same-length FASTA -> `reference_mismatch`;
          - half-truncated CRAM -> `input_corrupt`;
          - separate malformed CRAM version corruption -> `input_corrupt`.

          The malformed-version case is distinct from the truncation case so the TODO requirement for both truncation and corruption is not satisfied by one fixture under two names.

          ## 8. Network-isolation proof

          Permanent CI first proves that production HTSlib network transport features are absent. It then builds the exact `cram_v0_2` integration-test executable, obtains the executable path from Cargo JSON artifact metadata, and requires exactly one matching executable.

          The hostile-reference test is executed under a new Linux network namespace with `sudo unshare --net` and traced with `strace -f -e trace=network`. The trace is rejected if it contains an `AF_INET` or `AF_INET6` syscall. The exact validated implementation SHA passed this gate in Permanent CI run `31184689945`, job `92886187241`.

          The test environment supplies:

          - `REF_PATH=http://127.0.0.1:9/%s`;
          - a nonexistent hostile `REF_CACHE` path;
          - a nonexistent hostile `HTS_PATH` path.

          The correct explicit local FASTA still succeeds, and the no-network namespace plus syscall trace proves that this case does not attempt IPv4/IPv6 reference retrieval.

          ## 9. Milestone 7 task reconciliation

          ### 7.1 Backend behavior

          Complete. Versions are pinned, provider behavior is documented, remote transports are removed, and ADR-0004 records the decision.

          ### 7.2 Local-only resolution

          Complete under ADR-0004's scoped-neutralization design. Explicit FASTA, SN/LN/M5 validation, missing/mismatch failures, no alternate fallback, and actual FASTA provenance are implemented and tested.

          ### 7.3 Network isolation

          Complete. The hostile-M5 case runs in a network-disabled namespace with syscall observation, while missing/mismatch/correct-reference behavior is covered by the same permanent CRAM integration suite.

          ### 7.4 BAM/CRAM equivalence

          Complete. Equivalent fixtures, exact canonical counter/coverage comparison, constrained provenance comparison, truncation, and a distinct corruption fixture are covered.

          ## 10. Release-scope items intentionally left open

          Milestone 7 implementation evidence is complete, but the v0.2 release itself is **not** declared complete for two reasons:

          1. SPEC §4.2 says v0.2 adds `inspect` and `validate-reference` workflows. Those workflows are not implemented by Milestone 7 and are not listed in SPEC §19.2's v0.2 acceptance bullets. Their disposition must be explicitly reconciled before a v0.2 release claim.
          2. SPEC §8 literally says to override inherited reference environment state before opening CRAM. ADR-0004 implements the safer scoped-neutralization design instead. The specification should be amended or explicitly reconciled before release so the normative text and implementation do not disagree.

          The final TODO release-gate item requiring Permanent CI on the exact release commit therefore remains unchecked. No tag, release, merge-to-master, or v0.2 completion claim is made by this evidence document.
          EOF

          python - <<'PY'
          from pathlib import Path

          path = Path('docs/DNA_QC_ENGINE_TODO.md')
          text = path.read_text()

          replacements = [
              (
                  '**Status:** Ralph Loop active — `v0.1.0` released; Milestone 6 complete; Milestone 7 next',
                  '**Status:** Ralph Loop active — `v0.1.0` released; Milestone 7 implementation/evidence complete; v0.2 release gate remains open',
              ),
              (
                  '## Milestone 7 — CRAM local-reference design\n\n### 7.1 Pin and inspect backend behavior',
                  '## Milestone 7 — CRAM local-reference design\n\n**Status:** Implementation complete — validated implementation SHA `cf288efe8ffdc3542abedc95404bc6602515da4a`; Permanent CI run `31184689945`, job `92886187241`; Full Runtime Validation run `31184688346`, job `92886217801`; Reference Validation run `31184688367`, job `92886248460`; all successful. v0.2 release remains open pending the release-scope reconciliation below.\n\n### 7.1 Pin and inspect backend behavior',
              ),
              ('- [ ] Pin rust-htslib and HTSlib.', '- [x] Pin rust-htslib and HTSlib.'),
              ('- [ ] Verify version-specific `REF_PATH` and `REF_CACHE` behavior.', '- [x] Verify version-specific `REF_PATH` and `REF_CACHE` behavior.'),
              ('- [ ] Identify every implicit reference-provider path.', '- [x] Identify every implicit reference-provider path.'),
              ('- [ ] Confirm how to disable HTTP/HTTPS reference retrieval.', '- [x] Confirm how to disable HTTP/HTTPS reference retrieval.'),
              ('- [ ] Record findings in `ADR-0004-CRAM_REFERENCE_RESOLUTION.md`.', '- [x] Record findings in `ADR-0004-CRAM_REFERENCE_RESOLUTION.md`.'),
              ('- [ ] Override inherited reference environment before opening CRAM.', '- [x] Neutralize inherited reference-provider state without process-global mutation, per ADR-0004.'),
              ('- [ ] Require explicit local FASTA where needed.', '- [x] Require explicit local FASTA where needed.'),
              ('- [ ] Validate contig names, lengths, and MD5.', '- [x] Validate contig names, lengths, and MD5.'),
              ('- [ ] Fail on missing local sequence.', '- [x] Fail on missing local sequence.'),
              ('- [ ] Fail on supplied-reference mismatch.', '- [x] Fail on supplied-reference mismatch.'),
              ('- [ ] Never fall back to an alternate reference.', '- [x] Never fall back to an alternate reference.'),
              ('- [ ] Record actual local FASTA identity in provenance.', '- [x] Record actual local FASTA identity in provenance.'),
              ('- [ ] Run CRAM tests with no network access.', '- [x] Run CRAM tests with no network access.'),
              ('- [ ] Use a CRAM that would otherwise invite MD5 lookup.', '- [x] Use a CRAM that would otherwise invite MD5 lookup.'),
              ('- [ ] Assert no DNS/HTTP attempt where observable.', '- [x] Assert no DNS/HTTP attempt where observable.'),
              ('- [ ] Assert missing reference fails.', '- [x] Assert missing reference fails.'),
              ('- [ ] Assert mismatched reference fails.', '- [x] Assert mismatched reference fails.'),
              ('- [ ] Assert correct local reference succeeds.', '- [x] Assert correct local reference succeeds.'),
              ('- [ ] Produce equivalent BAM and CRAM fixtures.', '- [x] Produce equivalent BAM and CRAM fixtures.'),
              ('- [ ] Compare canonical counters.', '- [x] Compare canonical counters.'),
              ('- [ ] Compare canonical coverage.', '- [x] Compare canonical coverage.'),
              ('- [ ] Compare provenance differences only where format-specific.', '- [x] Compare provenance differences only where format-specific.'),
              ('- [ ] Test CRAM truncation and corruption.', '- [x] Test CRAM truncation and corruption.'),
              ('- [ ] Create `docs/evidence/V0_2_CRAM_VALIDATION.md`.', '- [x] Create `docs/evidence/V0_2_CRAM_VALIDATION.md`.'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one TODO occurrence for {old!r}, found {count}')
              text = text.replace(old, new, 1)

          gate_old = '- [x] Create `docs/evidence/V0_2_CRAM_VALIDATION.md`.\n- [ ] Permanent CI succeeds on the exact release commit.'
          gate_new = '''- [x] Create `docs/evidence/V0_2_CRAM_VALIDATION.md`.
- [ ] Reconcile SPEC §4.2 `inspect` / `validate-reference` workflow scope before declaring v0.2 complete.
- [ ] Reconcile SPEC §8 inherited-environment wording with ADR-0004 scoped neutralization, or amend the specification.
- [ ] Permanent CI succeeds on the exact release commit.'''
          if text.count(gate_old) != 1:
              raise SystemExit('expected v0.2 release-gate block not found exactly once')
          text = text.replace(gate_old, gate_new, 1)
          path.write_text(text)
          PY

          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' docs/DNA_QC_ENGINE_TODO.md docs/evidence/V0_2_CRAM_VALIDATION.md | sort)"
          if [[ "$changed" != "$expected" ]]; then
            echo 'unexpected evidence-assembly changes:' >&2
            git status --short >&2
            exit 1
          fi

      - name: Commit evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DNA_QC_ENGINE_TODO.md docs/evidence/V0_2_CRAM_VALIDATION.md
          git commit -m 'docs: record Milestone 7 CRAM validation evidence'
          git push origin HEAD:milestone-7-cram
