name: V0.5 ASan Diagnostic

on:
  push:
    branches: [agent/v0.5-production-beta]
    paths:
      - ".github/workflows/v0.5-asan-diagnostic.yml"
      - "crates/aligngauge-hts/**"
      - "crates/aligngauge-testkit/**"
      - "testdata/**"
  pull_request:
    paths:
      - ".github/workflows/v0.5-asan-diagnostic.yml"
      - "crates/aligngauge-hts/**"
      - "crates/aligngauge-testkit/**"
      - "testdata/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    name: diagnostic/v0.5-asan-isolate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install AddressSanitizer target
        run: rustup target add x86_64-unknown-linux-gnuasan

      - name: Isolate HTS validation leaks
        shell: bash
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNUASAN_LINKER: cc
          CC_x86_64_unknown_linux_gnuasan: cc
          CXX_x86_64_unknown_linux_gnuasan: c++
          CFLAGS_x86_64_unknown_linux_gnuasan: -fsanitize=address -fno-omit-frame-pointer
          CXXFLAGS_x86_64_unknown_linux_gnuasan: -fsanitize=address -fno-omit-frame-pointer
          CARGO_TARGET_DIR: target/v0.5-asan-diagnostic
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=0
        run: |
          set -euo pipefail
          mkdir -p target/v0.5-asan-diagnostic/logs
          tests=(
            every_committed_valid_v01_fixture_streams
            corrupt_and_unsorted_fixtures_fail_closed_with_expected_categories
            long_cigar_is_expanded_by_the_pinned_backend
            optional_tags_remain_explicit_and_read_groups_are_not_invented
            duplicate_read_group_declarations_are_ambiguous_not_silently_selected
            duplicate_and_contradictory_reference_declarations_are_rejected
            invalid_reference_length_is_rejected
            actual_sorted_coordinates_are_accepted_without_a_coordinate_header_claim
            coordinate_header_claim_does_not_hide_a_regression
            mapped_record_after_no_coordinate_tail_is_rejected
            reference_bound_violation_is_rejected
            reserved_flag_bits_are_rejected_as_unsupported
            unrequested_optional_fields_are_not_exposed
            header_identity_and_field_plan_are_deterministic
          )
          failed=0
          : > target/v0.5-asan-diagnostic/results.tsv
          for test_name in "${tests[@]}"; do
            echo "=== $test_name ==="
            set +e
            cargo test -p aligngauge-hts \
              --target x86_64-unknown-linux-gnuasan \
              --test validation \
              --locked \
              "$test_name" -- --exact --nocapture \
              >"target/v0.5-asan-diagnostic/logs/$test_name.log" 2>&1
            status=$?
            set -e
            printf '%s\t%s\n' "$test_name" "$status" \
              >> target/v0.5-asan-diagnostic/results.tsv
            if [[ $status -ne 0 ]]; then
              failed=1
              echo "ASan/LSan failure: $test_name" >&2
              tail -n 80 "target/v0.5-asan-diagnostic/logs/$test_name.log" >&2
            fi
          done
          cat target/v0.5-asan-diagnostic/results.tsv
          if [[ $failed -ne 0 ]]; then
            exit 1
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v0.5-asan-diagnostic-${{ github.sha }}
          path: target/v0.5-asan-diagnostic/
          if-no-files-found: error
          retention-days: 7
