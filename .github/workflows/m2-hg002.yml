name: M2 HG002 Preparation Validation

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/m2-hg002.yml"
      - "crates/aligngauge-cli/**"
      - "crates/aligngauge-core/**"
      - "crates/aligngauge-coverage/**"
      - "crates/aligngauge-hts/**"
      - "crates/aligngauge-metrics/**"
      - "testdata/hg002/**"
      - "tools/ci/v0_1_benchmark.py"
      - "tools/reference/samtools/**"
      - "docs/DNA_QC_ENGINE_TODO.md"
      - "docs/evidence/M5_COVERAGE.md"
      - "docs/evidence/V0_1_PERFORMANCE_REPORT.md"
      - "docs/evidence/V0_1_VALIDATION_REPORT.md"
      - "docs/evidence/V0_1_RELEASE_CHECKLIST.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: ci/hg002-preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Prepare HG002 subset twice
        run: |
          testdata/hg002/prepare.sh "$GITHUB_WORKSPACE/target/hg002-first"
          testdata/hg002/prepare.sh "$GITHUB_WORKSPACE/target/hg002-second"

      - name: Prove deterministic preparation identities
        run: |
          cmp target/hg002-first/prepared.manifest target/hg002-second/prepared.manifest
          grep -F 'schema=aligngauge-hg002-preparation-v1' target/hg002-first/prepared.manifest
          grep -F 'source_bam_md5=f5360b7adbc798c90a78f290de928eca' target/hg002-first/prepared.manifest
          grep -F 'source_bai_md5=1d7fd88891eee203c02fb852cac95301' target/hg002-first/prepared.manifest
          grep -F 'region=chr20:10000000-11000000' target/hg002-first/prepared.manifest
          grep -F 'subsample_seed=42' target/hg002-first/prepared.manifest
          grep -F 'subsample_fraction=0.37037037037037' target/hg002-first/prepared.manifest
          test -s target/hg002-first/subset.bam
          test -s target/hg002-first/subset.bam.bai
          test -f target/hg002-first/_SUCCESS
          test -f target/hg002-second/_SUCCESS

      - name: Compare HG002 counters to pinned Samtools
        run: |
          cargo build -p aligngauge-cli --locked
          tools/reference/samtools/run-reference.sh \
            flagstat \
            target/hg002-first/subset.bam \
            target/hg002-m4/reference-flagstat
          tools/reference/samtools/run-reference.sh \
            idxstats \
            target/hg002-first/subset.bam \
            target/hg002-m4/reference-idxstats
          target/debug/aligngauge qc \
            --input target/hg002-first/subset.bam \
            --format samtools-flagstat \
            > target/hg002-m4/aligngauge-flagstat.txt
          target/debug/aligngauge qc \
            --input target/hg002-first/subset.bam \
            --format samtools-idxstats \
            > target/hg002-m4/aligngauge-idxstats.txt
          tools/reference/samtools/compare-flagstat.py \
            target/hg002-m4/reference-flagstat/stdout.txt \
            target/hg002-m4/aligngauge-flagstat.txt
          diff -u \
            target/hg002-m4/reference-idxstats/stdout.txt \
            target/hg002-m4/aligngauge-idxstats.txt

      - name: Prepare deterministic HG002 coverage projection twice
        run: |
          testdata/hg002/prepare-coverage-projection.sh \
            target/hg002-first/subset.bam \
            "$GITHUB_WORKSPACE/target/hg002-coverage-first"
          testdata/hg002/prepare-coverage-projection.sh \
            target/hg002-first/subset.bam \
            "$GITHUB_WORKSPACE/target/hg002-coverage-second"
          cmp \
            target/hg002-coverage-first/prepared.manifest \
            target/hg002-coverage-second/prepared.manifest
          grep -F 'schema=aligngauge-hg002-coverage-projection-v1' \
            target/hg002-coverage-first/prepared.manifest

      - name: Compare HG002 coverage to pinned Samtools
        run: |
          cargo build -p aligngauge-coverage --bin coverage_probe --locked
          target/debug/coverage_probe \
            target/hg002-first/subset.bam \
            > target/hg002-m5-full-header-probe.json
          tools/reference/samtools/run-reference.sh \
            depth \
            target/hg002-coverage-first/subset.bam \
            target/hg002-m5/reference-depth
          python tools/reference/samtools/summarize-depth.py \
            target/hg002-m5/reference-depth/stdout.txt \
            target/hg002-m5/reference-summary.json
          target/debug/coverage_probe \
            target/hg002-coverage-first/subset.bam \
            > target/hg002-m5/aligngauge-probe.json
          python tools/reference/samtools/compare-coverage.py \
            target/hg002-m5/reference-summary.json \
            target/hg002-m5/aligngauge-probe.json

      - name: Run complete v0.1 HG002 release path
        run: |
          cargo build --release -p aligngauge-cli --bin aligngauge --locked
          target/release/aligngauge qc \
            --input target/hg002-first/subset.bam \
            --outdir target/hg002-v0_1-release \
            --memory-limit 1GiB \
            --quiet
          test -f target/hg002-v0_1-release/summary.json
          test -f target/hg002-v0_1-release/provenance.json
          test -f target/hg002-v0_1-release/_SUCCESS
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('target/hg002-v0_1-release')
          summary = json.loads((out / 'summary.json').read_text())
          provenance = json.loads((out / 'provenance.json').read_text())
          assert summary['alignment_counters']['status'] == 'available'
          assert summary['coverage']['status'] == 'available'
          assert summary['coverage']['value']['per_reference']
          assert summary['coverage']['value']['threshold_percentages']
          assert provenance['analysis_plan']['bam_traversals'] == 1
          assert provenance['analysis_plan']['coverage_strategy'] == 'parameterized-chunked-delta-v1'
          PY

      - name: Measure v0.1 performance baseline
        run: |
          cargo build --release -p aligngauge-cli --example v0_1_benchmark_probe --locked
          python tools/ci/v0_1_benchmark.py \
            --probe target/release/examples/v0_1_benchmark_probe \
            --input target/hg002-first/subset.bam \
            --output target/v0_1-performance-baseline.json \
            --memory-limit-bytes 1073741824 \
            --repetitions 3
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('target/v0_1-performance-baseline.json').read_text())
          assert report['schema'] == 'aligngauge-v0.1-performance-baseline-v1'
          assert report['benchmark']['warmups_per_mode'] == 1
          assert report['benchmark']['measured_repetitions_per_mode'] == 3
          assert report['benchmark']['modes']['combined']['semantic_output']['input_traversals'] == 1
          assert report['interpretation']['speedup_claim'] is None
          for mode in ('reader', 'counters', 'coverage', 'combined'):
              assert len(report['benchmark']['modes'][mode]['measurements']) == 3
          PY

      - name: Upload preparation and v0.1 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hg002-preparation-${{ github.sha }}
          path: |
            target/hg002-first/prepared.manifest
            target/hg002-first/_SUCCESS
            target/hg002-second/prepared.manifest
            target/hg002-second/_SUCCESS
            target/hg002-m4/reference-flagstat/stdout.txt
            target/hg002-m4/reference-idxstats/stdout.txt
            target/hg002-m4/aligngauge-flagstat.txt
            target/hg002-m4/aligngauge-idxstats.txt
            target/hg002-coverage-first/prepared.manifest
            target/hg002-coverage-first/_SUCCESS
            target/hg002-coverage-second/prepared.manifest
            target/hg002-coverage-second/_SUCCESS
            target/hg002-m5-full-header-probe.json
            target/hg002-m5/reference-depth/stdout.txt
            target/hg002-m5/reference-summary.json
            target/hg002-m5/aligngauge-probe.json
            target/hg002-v0_1-release/summary.json
            target/hg002-v0_1-release/provenance.json
            target/hg002-v0_1-release/_SUCCESS
            target/v0_1-performance-baseline.json
          if-no-files-found: error
          retention-days: 7
