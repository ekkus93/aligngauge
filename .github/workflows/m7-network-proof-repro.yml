name: M7 network proof wrapper repro

on:
  push:
    branches: [milestone-7-cram]
    paths:
      - .github/workflows/m7-network-proof-repro.yml

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Reproduce Permanent CI context
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-features --locked
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace

      - name: Capture wrapper proof
        shell: bash
        run: |
          set -u
          build_json="$PWD/build.json"
          trace="$PWD/network.trace"
          : > diagnostic.meta
          : > test.stdout
          : > test.stderr
          : > network.matches

          cargo test -p aligngauge-cli --test cram_v0_2 --no-run --locked \
            --message-format=json > "$build_json" 2> build.stderr
          cargo_rc=$?
          echo "cargo_rc=$cargo_rc" >> diagnostic.meta

          python - "$build_json" > selected.txt 2> selection.stderr <<'PY'
          import json
          import os
          import sys

          executables = []
          with open(sys.argv[1], encoding='utf-8') as handle:
              for line in handle:
                  message = json.loads(line)
                  if message.get('reason') != 'compiler-artifact':
                      continue
                  target = message.get('target', {})
                  executable = message.get('executable')
                  if target.get('name') == 'cram_v0_2' and executable:
                      executables.append(os.path.realpath(executable))

          unique = sorted(set(executables))
          print(f'executables={unique}', file=sys.stderr)
          if len(unique) != 1:
              raise SystemExit(3)
          print(unique[0])
          PY
          selection_rc=$?
          echo "selection_rc=$selection_rc" >> diagnostic.meta
          test_bin="$(cat selected.txt 2>/dev/null || true)"
          echo "test_bin=$test_bin" >> diagnostic.meta
          if [[ -x "$test_bin" ]]; then
            echo 'test_bin_executable=yes' >> diagnostic.meta
          else
            echo 'test_bin_executable=no' >> diagnostic.meta
          fi

          if [[ "$selection_rc" -eq 0 && -x "$test_bin" ]]; then
            sudo unshare --net /usr/bin/strace -f -qq -e trace=network -o "$trace" \
              "$test_bin" --exact hostile_reference_environment_cannot_replace_explicit_local_policy \
              > test.stdout 2> test.stderr
            test_rc=$?
          else
            test_rc=125
          fi
          echo "test_rc=$test_rc" >> diagnostic.meta
          grep -E 'AF_INET|AF_INET6' "$trace" > network.matches || true
          echo "network_match_lines=$(wc -l < network.matches)" >> diagnostic.meta

          cat diagnostic.meta
          cat selection.stderr
          cat test.stdout
          cat test.stderr
          cat network.matches
          exit 0

      - name: Upload wrapper diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m7-network-wrapper-${{ github.sha }}
          path: |
            diagnostic.meta
            build.json
            build.stderr
            selected.txt
            selection.stderr
            test.stdout
            test.stderr
            network.trace
            network.matches
          if-no-files-found: error
          retention-days: 1
