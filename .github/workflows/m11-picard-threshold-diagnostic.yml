name: M11 Picard Threshold Diagnostic

on:
  push:
    branches:
      - milestone-11-picard-profiles
    paths:
      - .github/workflows/m11-picard-threshold-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect pinned Picard bytecode and threshold behavior
        shell: bash
        run: |
          set -euo pipefail
          source tools/reference/picard/image.lock
          docker pull "$image" >/dev/null
          echo '=== jar manifest/version clues ==='
          docker run --rm --entrypoint /bin/sh "$image" -c '
            unzip -p /usr/picard/picard.jar META-INF/MANIFEST.MF | head -80 || true
            echo "=== javap addMetricsToFile ==="
            javap -classpath /usr/picard/picard.jar -c -p "picard.analysis.directed.InsertSizeMetricsCollector$PerUnitInsertSizeMetricsCollector" | sed -n "/addMetricsToFile/,/getWidthToTrimTo/p"
          '

          root="$RUNNER_TEMP/picard-threshold"
          mkdir -p "$root"
          input="$(realpath testdata/fixtures/picard_insert_edge.bam)"
          for pct in default 0.05 0.049999999 0.049 0.0; do
            out="$root/$pct"
            mkdir -p "$out"
            args=(
              -jar "$jar" CollectInsertSizeMetrics
              INPUT=/input/picard_insert_edge.bam
              OUTPUT=/output/metrics.txt
              HISTOGRAM_FILE=/output/histogram.pdf
            )
            if [[ "$pct" != default ]]; then
              args+=(MINIMUM_PCT="$pct")
            fi
            docker run --rm --network none \
              --entrypoint "$java" \
              -v "$(dirname "$input"):/input:ro" \
              -v "$out:/output" \
              "$image" "${args[@]}" >/dev/null 2>"$out/stderr.txt"
            echo "=== MINIMUM_PCT=$pct ==="
            if [[ -f "$out/metrics.txt" ]]; then
              awk 'BEGIN{m=0} /^## METRICS CLASS/{m=1; next} m && NF {print} /^## HISTOGRAM/{exit}' "$out/metrics.txt"
            else
              echo '<no metrics file>'
            fi
          done
