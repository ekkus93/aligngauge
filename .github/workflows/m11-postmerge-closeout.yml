name: M11 Post-Merge Closeout

on:
  push:
    branches:
      - m11-postmerge-closeout
    paths:
      - .github/workflows/m11-postmerge-closeout.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve guarded closeout script
        run: cp scripts/m11_postmerge_closeout.py "$RUNNER_TEMP/m11_postmerge_closeout.py"
      - name: Verify exact master boundary and apply closeout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          expected='b5ec36f05110a458fbc70a1b38debeefa2a195cd'
          actual="$(git rev-parse origin/master)"
          [[ "$actual" == "$expected" ]] || {
            echo "master moved: expected $expected, observed $actual" >&2
            exit 1
          }
          git checkout -B master origin/master
          python3 "$RUNNER_TEMP/m11_postmerge_closeout.py"
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          [[ "${#changed[@]}" -eq 3 ]]
          for path in "${changed[@]}"; do
            case "$path" in
              README.md|docs/DNA_QC_ENGINE_TODO.md|docs/evidence/M11_PICARD_ALIGNMENT_INSERT_SIZE.md) ;;
              *) echo "unexpected closeout path: $path" >&2; exit 1 ;;
            esac
          done
      - name: Commit guarded closeout to master
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/DNA_QC_ENGINE_TODO.md docs/evidence/M11_PICARD_ALIGNMENT_INSERT_SIZE.md
          git commit -m 'docs: close Milestone 11 after merged validation'
          git push origin HEAD:master
