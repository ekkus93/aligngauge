name: M7 reader source builder v2

on:
  push:
    branches: [milestone-7-cram]
    paths:
      - .github/workflows/m7-reader-build-v2.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Reuse reader patch and apply strict-lint repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/m7-reader-build.yml').read_text()
          marker = "          from pathlib import Path\n"
          start = source.index(marker)
          end = source.index("\n          PY", start)
          patch = textwrap.dedent(source[start:end])
          exec(compile(patch, 'm7-reader-patch', 'exec'), {})

          reference = Path('crates/aligngauge-hts/src/reference.rs')
          text = reference.read_text()
          text = text.replace(
              '''        if let Some(expected_md5) = requirement.md5() {\n            if actual.md5 != expected_md5 {\n                return Err(AlignGaugeError::new(\n                    ErrorCategory::ReferenceMismatch,\n                    "supplied local FASTA reference MD5 does not match the CRAM header",\n                )\n                .with_detail("reference_name", requirement.name().to_owned())\n                .with_detail("expected_md5", expected_md5.to_owned())\n                .with_detail("actual_md5", actual.md5.clone()));\n            }\n        }''',
              '''        if let Some(expected_md5) = requirement.md5()\n            && actual.md5 != expected_md5\n        {\n            return Err(AlignGaugeError::new(\n                ErrorCategory::ReferenceMismatch,\n                "supplied local FASTA reference MD5 does not match the CRAM header",\n            )\n            .with_detail("reference_name", requirement.name().to_owned())\n            .with_detail("expected_md5", expected_md5.to_owned())\n            .with_detail("actual_md5", actual.md5.clone()));\n        }''',
          )
          text = text.replace(
              '''        if let Some(value) = &md5 {\n            if value.len() != 32 || !value.bytes().all(|byte| byte.is_ascii_hexdigit()) {\n                return Err(reference_header_error(line_number, "@SQ M5 is not a 32-digit MD5")\n                    .with_detail("reference_name", name.clone())\n                    .with_detail("md5", value.clone()));\n            }\n        }''',
              '''        if let Some(value) = &md5\n            && (value.len() != 32 || !value.bytes().all(|byte| byte.is_ascii_hexdigit()))\n        {\n            return Err(reference_header_error(line_number, "@SQ M5 is not a 32-digit MD5")\n                .with_detail("reference_name", name.clone())\n                .with_detail("md5", value.clone()));\n        }''',
          )
          text = text.replace('.split(|byte| byte.is_ascii_whitespace())', '.split(u8::is_ascii_whitespace)')
          reference.write_text(text)

          lib = Path('crates/aligngauge-hts/src/lib.rs')
          text = lib.read_text()
          text = text.replace('/// Vendored HTSlib line', '/// Vendored `HTSlib` line')
          text = text.replace('production HTSlib build.', 'production `HTSlib` build.')
          lib.write_text(text)

          reader = Path('crates/aligngauge-hts/src/reader.rs')
          text = reader.read_text()
          text = text.replace('before HTSlib traversal.', 'before `HTSlib` traversal.')
          text = text.replace('invalid options, HTSlib failures', 'invalid options, `HTSlib` failures')
          text = text.replace('pinned HTSlib build.', 'pinned `HTSlib` build.')
          text = text.replace('/// HTSlib reference configuration failures', '/// `HTSlib` reference configuration failures')
          text = text.replace('without asking HTSlib to resolve references.', 'without asking `HTSlib` to resolve references.')
          reader.write_text(text)
          PY

      - name: Refresh lockfile and validate
        run: |
          cargo check --workspace --all-features
          cargo fmt --all
          cargo check --workspace --all-features --locked
          cargo clippy -p aligngauge-hts --all-targets --all-features --locked -- -D warnings
          cargo test -p aligngauge-hts --all-features --locked
          git diff --check

      - name: Commit product source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/aligngauge-hts/src/reader.rs crates/aligngauge-hts/src/reference.rs crates/aligngauge-hts/src/lib.rs Cargo.lock
          git commit -m 'feat: add local-only CRAM reader boundary'
          git push origin HEAD:milestone-7-cram
