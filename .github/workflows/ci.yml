name: Permanent CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Temporary write scope is used only to bootstrap the Milestone 1 local-package
# lockfile update. It is removed immediately after Cargo.lock is committed.
permissions:
  contents: write

concurrency:
  group: permanent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ci/permanent
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Show pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Generate Milestone 1 dependency lockfile
        run: cargo generate-lockfile

      - name: Commit generated lockfile during bootstrap
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: lock Milestone 1 core contracts"
          git push origin HEAD:master

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Validate committed JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("schemas").glob("*.json")):
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
          PY

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify repository remains clean
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff --check
            exit 1
          fi
