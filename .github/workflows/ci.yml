name: Permanent CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permanent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ci/permanent
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Verify dependency lockfile
        run: cargo update --workspace --locked --dry-run

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Validate committed JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("schemas").glob("*.json")):
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
          PY

      - name: Verify committed test-data manifest locally
        run: cargo run -p aligngauge-testkit --locked -- verify-manifest --root .

      - name: Prove synthetic corpus regenerates byte-identically
        run: |
          regenerated="$(mktemp -d)"
          trap 'rm -rf "$regenerated"' EXIT
          cargo run -p aligngauge-testkit --locked -- generate-corpus --root "$regenerated"
          diff -ru -- testdata/fixtures "$regenerated/testdata/fixtures"
          diff -ru -- testdata/expected "$regenerated/testdata/expected"
          diff -u -- testdata/manifest.v1.tsv "$regenerated/testdata/manifest.v1.tsv"

      - name: Validate reference and preparation scripts
        run: |
          bash -n tools/reference/samtools/run-reference.sh
          bash -n tools/reference/samtools/run-baselines.sh
          bash -n tools/reference/samtools/compare-coverage.sh
          bash -n testdata/hg002/prepare.sh
          bash -n testdata/hg002/prepare-coverage-projection.sh
          python -m py_compile \
            tools/reference/samtools/summarize-depth.py \
            tools/reference/samtools/compare-coverage.py \
            tools/ci/check_coverage_rss.py \
            testdata/hg002/project-coverage-sam.py

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify repository remains clean
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff --check
            exit 1
          fi
