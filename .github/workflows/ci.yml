name: Permanent CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permanent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ci/permanent
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Verify dependency lockfile
        run: cargo update --workspace --locked --dry-run

      - name: Verify CRAM network transports are excluded
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^name = "curl-sys"$' Cargo.lock; then
            echo 'curl-sys must not be present in the production dependency graph' >&2
            exit 1
          fi

          cargo tree -p aligngauge-hts -e features --locked > /tmp/aligngauge-hts-features.txt
          cat /tmp/aligngauge-hts-features.txt
          if grep -E 'rust-htslib feature "(curl|s3|gcs)"|hts-sys feature "(curl|s3|gcs)"' \
            /tmp/aligngauge-hts-features.txt; then
            echo 'HTSlib network transport feature is enabled' >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Validate committed JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("schemas").glob("*.json")):
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
          PY

      - name: Verify committed test-data manifest locally
        run: cargo run -p aligngauge-testkit --locked -- verify-manifest --root .

      - name: Prove synthetic corpus regenerates byte-identically
        run: |
          regenerated="$(mktemp -d)"
          trap 'rm -rf "$regenerated"' EXIT
          cargo run -p aligngauge-testkit --locked -- generate-corpus --root "$regenerated"
          diff -ru -- testdata/fixtures "$regenerated/testdata/fixtures"
          diff -ru -- testdata/expected "$regenerated/testdata/expected"
          diff -u -- testdata/manifest.v1.tsv "$regenerated/testdata/manifest.v1.tsv"

      - name: Validate reference and preparation scripts
        run: |
          bash -n tools/reference/samtools/run-reference.sh
          bash -n tools/reference/samtools/run-baselines.sh
          bash -n tools/reference/samtools/compare-coverage.sh
          bash -n tools/reference/samtools/run-target-depth.sh
          bash -n tools/reference/samtools/run-stats.sh
          bash -n tools/reference/multiqc/validate-samtools-stats.sh
          bash -n testdata/hg002/prepare.sh
          bash -n testdata/hg002/prepare-coverage-projection.sh
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("tools/reference/samtools/summarize-depth.py"),
              Path("tools/reference/samtools/compare-coverage.py"),
              Path("tools/reference/samtools/compare-target-depth.py"),
              Path("tools/reference/samtools/compare-stats.py"),
              Path("tools/ci/check_coverage_rss.py"),
              Path("testdata/hg002/project-coverage-sam.py"),
          ]
          for path in paths:
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Install syscall tracer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace
          /usr/bin/strace --version

      - name: Prove CRAM reference isolation with no network access
        shell: bash
        run: |
          set -uo pipefail

          fail() {
            echo "::error title=CRAM network isolation::$1"
            exit 1
          }

          command -v strace >/dev/null || fail 'strace is unavailable after installation'
          command -v unshare >/dev/null || fail 'unshare is unavailable on the runner'

          build_json="$RUNNER_TEMP/aligngauge-cram-build.json"
          build_stderr="$RUNNER_TEMP/aligngauge-cram-build.stderr"
          selection_stderr="$RUNNER_TEMP/aligngauge-cram-selection.stderr"
          trace="$RUNNER_TEMP/aligngauge-cram-network.trace"
          test_stdout="$RUNNER_TEMP/aligngauge-cram-test.stdout"
          test_stderr="$RUNNER_TEMP/aligngauge-cram-test.stderr"
          rm -f "$build_json" "$build_stderr" "$selection_stderr" "$trace" \
            "$test_stdout" "$test_stderr"

          if ! cargo test -p aligngauge-cli --test cram_v0_2 --no-run --locked \
            --message-format=json > "$build_json" 2> "$build_stderr"; then
            cat "$build_stderr" >&2
            fail 'failed to build the CRAM integration-test executable'
          fi

          if ! test_bin="$(python - "$build_json" 2> "$selection_stderr" <<'PY'
          import json
          import os
          import sys

          executables = []
          with open(sys.argv[1], encoding='utf-8') as handle:
              for line in handle:
                  message = json.loads(line)
                  if message.get('reason') != 'compiler-artifact':
                      continue
                  target = message.get('target', {})
                  executable = message.get('executable')
                  if target.get('name') == 'cram_v0_2' and executable:
                      executables.append(os.path.realpath(executable))

          unique = sorted(set(executables))
          if len(unique) != 1:
              print(
                  f'expected exactly one cram_v0_2 executable from Cargo metadata, got {unique}',
                  file=sys.stderr,
              )
              raise SystemExit(3)
          print(unique[0])
          PY
          )"; then
            cat "$selection_stderr" >&2
            fail 'Cargo metadata did not identify exactly one CRAM integration-test executable'
          fi

          if [[ ! -x "$test_bin" ]]; then
            printf 'selected executable: %s\n' "$test_bin" >&2
            fail 'selected CRAM integration-test path is not executable'
          fi
          printf 'CRAM isolation executable: %s\n' "$test_bin"

          if ! sudo unshare --net /usr/bin/strace -f -qq -e trace=network -o "$trace" \
            "$test_bin" --exact hostile_reference_environment_cannot_replace_explicit_local_policy \
            > "$test_stdout" 2> "$test_stderr"; then
            cat "$test_stdout" >&2 || true
            cat "$test_stderr" >&2 || true
            cat "$trace" >&2 || true
            fail 'CRAM hostile-reference test failed inside the network-disabled namespace'
          fi

          cat "$test_stdout"
          if grep -E 'AF_INET|AF_INET6' "$trace" > "$RUNNER_TEMP/aligngauge-cram-network.matches"; then
            cat "$RUNNER_TEMP/aligngauge-cram-network.matches" >&2
            fail 'CRAM reference-isolation test attempted an IPv4/IPv6 network syscall'
          fi
          echo 'CRAM network isolation proof passed: isolated test succeeded with zero IPv4/IPv6 syscalls.'

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify repository remains clean
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff --check
            exit 1
          fi
