name: Permanent CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permanent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ci/permanent
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Verify dependency lockfile
        run: cargo update --workspace --locked --dry-run

      - name: Verify CRAM network transports are excluded
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^name = "curl-sys"$' Cargo.lock; then
            echo 'curl-sys must not be present in the production dependency graph' >&2
            exit 1
          fi

          cargo tree -p aligngauge-hts -e features --locked > /tmp/aligngauge-hts-features.txt
          cat /tmp/aligngauge-hts-features.txt
          if grep -E 'rust-htslib feature "(curl|s3|gcs)"|hts-sys feature "(curl|s3|gcs)"' \
            /tmp/aligngauge-hts-features.txt; then
            echo 'HTSlib network transport feature is enabled' >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Validate committed JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("schemas").glob("*.json")):
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
          PY

      - name: Verify committed test-data manifest locally
        run: cargo run -p aligngauge-testkit --locked -- verify-manifest --root .

      - name: Prove synthetic corpus regenerates byte-identically
        run: |
          regenerated="$(mktemp -d)"
          trap 'rm -rf "$regenerated"' EXIT
          cargo run -p aligngauge-testkit --locked -- generate-corpus --root "$regenerated"
          diff -ru -- testdata/fixtures "$regenerated/testdata/fixtures"
          diff -ru -- testdata/expected "$regenerated/testdata/expected"
          diff -u -- testdata/manifest.v1.tsv "$regenerated/testdata/manifest.v1.tsv"

      - name: Validate reference and preparation scripts
        run: |
          bash -n tools/reference/samtools/run-reference.sh
          bash -n tools/reference/samtools/run-baselines.sh
          bash -n tools/reference/samtools/compare-coverage.sh
          bash -n testdata/hg002/prepare.sh
          bash -n testdata/hg002/prepare-coverage-projection.sh
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("tools/reference/samtools/summarize-depth.py"),
              Path("tools/reference/samtools/compare-coverage.py"),
              Path("tools/ci/check_coverage_rss.py"),
              Path("testdata/hg002/project-coverage-sam.py"),
          ]
          for path in paths:
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Install syscall tracer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace
          /usr/bin/strace --version

      - name: Prove CRAM reference isolation with no network access
        shell: bash
        run: |
          set -euo pipefail
          command -v strace
          command -v unshare

          build_json="$(mktemp)"
          trace="$(mktemp)"
          trap 'rm -f "$build_json" "$trace"' EXIT
          cargo test -p aligngauge-cli --test cram_v0_2 --no-run --locked \
            --message-format=json > "$build_json"
          test_bin="$(python - "$build_json" <<'PY'
          import json
          import os
          import sys

          executables = []
          with open(sys.argv[1], encoding='utf-8') as handle:
              for line in handle:
                  message = json.loads(line)
                  if message.get('reason') != 'compiler-artifact':
                      continue
                  target = message.get('target', {})
                  executable = message.get('executable')
                  if target.get('name') == 'cram_v0_2' and executable:
                      executables.append(os.path.realpath(executable))

          unique = sorted(set(executables))
          if len(unique) != 1:
              raise SystemExit(
                  f'expected exactly one cram_v0_2 executable from Cargo metadata, got {unique}'
              )
          print(unique[0])
          PY
          )"
          test -x "$test_bin"

          sudo unshare --net /usr/bin/strace -f -qq -e trace=network -o "$trace" \
            "$test_bin" --exact hostile_reference_environment_cannot_replace_explicit_local_policy
          if grep -E 'AF_INET|AF_INET6' "$trace"; then
            echo 'CRAM reference-isolation test attempted an IPv4/IPv6 network syscall' >&2
            exit 1
          fi

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify repository remains clean
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff --check
            exit 1
          fi
