name: Permanent CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permanent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: ci/permanent
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Verify dependency lockfile
        run: cargo update --workspace --locked --dry-run

      - name: Apply exact Clippy repairs
        run: python tools/m1_clippy_repairs.py

      - name: Update typed-error walking-skeleton assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/aligngauge-cli/tests/walking_skeleton.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'String::from_utf8_lossy(&output.stderr).contains("failed to open BAM")',
                  'String::from_utf8_lossy(&output.stderr).contains("[input_not_found]")',
              ),
              (
                  'stderr.contains("failed to open BAM") || stderr.contains("failed to read BAM")',
                  'stderr.contains("[input_corrupt]")',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one assertion match for {old!r}, found {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format repaired sources
        run: cargo fmt --all

      - name: Validate schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("schemas").glob("*.json")):
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
          PY

      - name: Validate repaired sources with Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Export exact validated repair
        run: |
          git diff --binary > validated-m1-repair.patch
          tar -czf validated-m1-repair.tar.gz \
            .github/workflows/ci.yml \
            crates/aligngauge-cli/tests/walking_skeleton.rs \
            crates/aligngauge-core/src/atomic.rs \
            crates/aligngauge-core/src/config.rs \
            crates/aligngauge-core/src/error.rs \
            crates/aligngauge-core/src/json.rs \
            crates/aligngauge-core/src/lib.rs \
            crates/aligngauge-core/src/model.rs \
            crates/aligngauge-core/tests/contracts.rs
          sha256sum validated-m1-repair.patch validated-m1-repair.tar.gz > validated-m1-repair.sha256

      - name: Upload validated repair artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-m1-repair-${{ github.sha }}
          path: |
            validated-m1-repair.patch
            validated-m1-repair.tar.gz
            validated-m1-repair.sha256
          if-no-files-found: error
          retention-days: 1
