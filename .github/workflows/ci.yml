name: Permanent CI

# Bounded documentation-signoff workflow; the committed signoff deletes its script.
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ci.yml"

permissions:
  contents: write

concurrency:
  group: permanent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signoff:
    name: ci/permanent
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Apply Milestone 1 documentation signoff
        run: python tools/m1_docs_signoff.py

      - name: Validate documentation update
        run: |
          git diff --check
          grep -F '**Repository:** `ekkus93/aligngauge`' docs/DNA_QC_ENGINE_TODO.md
          grep -F '**Status:** Complete — evidence SHA `ffafa45c1d6dea99c50f61e05498690d594bae27`' docs/DNA_QC_ENGINE_TODO.md
          grep -F 'Milestone 1 is complete.' docs/evidence/M1_CORE_CONTRACTS.md
          if sed -n '/## Milestone 1 /,/## Milestone 2 /p' docs/DNA_QC_ENGINE_TODO.md | grep -F -- '- [ ]'; then
            echo 'Milestone 1 contains an unchecked item'
            exit 1
          fi

      - name: Commit Milestone 1 documentation signoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DNA_QC_ENGINE_TODO.md docs/evidence/M1_CORE_CONTRACTS.md tools/m1_docs_signoff.py
          git commit -m "docs: close Milestone 1 core contracts"
          git push origin HEAD:master
