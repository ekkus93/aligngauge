name: Permanent CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: permanent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: ci/permanent
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Show pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Verify dependency lockfile
        run: cargo update --workspace --locked --dry-run

      - name: Apply exact Clippy repairs
        run: python tools/m1_clippy_repairs.py

      - name: Format repaired sources
        run: cargo fmt --all

      - name: Validate schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("schemas").glob("*.json")):
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
          PY

      - name: Validate repaired sources with Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Commit validated repairs and permanent workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy strict Milestone 1 contracts"
          git push origin HEAD:master
