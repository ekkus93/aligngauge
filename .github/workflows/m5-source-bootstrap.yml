name: M5 Source Bootstrap Finalizer

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/m5-source-bootstrap.yml"
      - "Cargo.toml"
      - "crates/aligngauge-coverage/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    name: m5/source-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Generate exact lockfile and rustfmt source
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo update --workspace --locked --dry-run
          cargo fmt --all --check
          git diff --check
      - name: Reject unexpected generated changes
        run: |
          python - <<'PY'
          import subprocess
          allowed_prefix = "crates/aligngauge-coverage/"
          allowed_exact = {"Cargo.lock"}
          output = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          )
          paths = []
          for line in output.splitlines():
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.append(path)
          unexpected = [
              path for path in paths
              if path not in allowed_exact and not path.startswith(allowed_prefix)
          ]
          if unexpected:
              raise SystemExit(f"unexpected bootstrap changes: {unexpected}")
          if "Cargo.lock" not in paths:
              raise SystemExit("Cargo.lock was not updated for the new workspace member")
          PY
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/aligngauge-coverage
          git commit -m "build: finalize Milestone 5 generated source state"
          git push origin HEAD:master
