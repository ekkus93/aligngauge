name: One-time v0.1.0 post-release closure

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-time-v0.1.0-release.yml

permissions:
  contents: write

jobs:
  close:
    name: release/v0.1.0-closure
    if: github.repository == 'ekkus93/aligngauge'
    runs-on: ubuntu-24.04
    env:
      RELEASE_SHA: 9423a9d3496459fdbceb2e7bc5178b4b3100357c
      PRODUCT_SHA: f93001cf22a2315f01e6b857c295720d99e392ca
      TAG_NAME: v0.1.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify published release target
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          ref="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/ref/tags/${TAG_NAME}")"
          release="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/releases/tags/${TAG_NAME}")"

          [[ "$(jq -r '.object.sha' <<<"${ref}")" == "${RELEASE_SHA}" ]]
          [[ "$(jq -r '.target_commitish' <<<"${release}")" == "${RELEASE_SHA}" ]]
          [[ "$(jq -r '.draft' <<<"${release}")" == "false" ]]
          [[ "$(jq -r '.prerelease' <<<"${release}")" == "false" ]]

      - name: Commit closure documentation and remove publisher
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          auth=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          head_json="$(curl --fail --silent --show-error "${auth[@]}" "${api}/git/ref/heads/master")"
          head_sha="$(jq -r '.object.sha' <<<"${head_json}")"
          if [[ "${head_sha}" != "${GITHUB_SHA}" ]]; then
            echo "master moved from workflow SHA ${GITHUB_SHA} to ${head_sha}; refusing stale closure." >&2
            exit 1
          fi

          commit_json="$(curl --fail --silent --show-error "${auth[@]}" "${api}/git/commits/${head_sha}")"
          base_tree="$(jq -r '.tree.sha' <<<"${commit_json}")"

          fetch_text_file() {
            local path="$1"
            local dest="$2"
            curl --fail --silent --show-error "${auth[@]}" \
              "${api}/contents/${path}?ref=${head_sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode > "${dest}"
          }

          fetch_text_file README.md /tmp/README.md
          fetch_text_file docs/evidence/V0_1_RELEASE_CHECKLIST.md /tmp/V0_1_RELEASE_CHECKLIST.md
          fetch_text_file docs/DNA_QC_ENGINE_TODO.md /tmp/DNA_QC_ENGINE_TODO.md

          python3 <<'PY'
          from pathlib import Path

          release_sha = "9423a9d3496459fdbceb2e7bc5178b4b3100357c"
          product_sha = "f93001cf22a2315f01e6b857c295720d99e392ca"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # README: release state must no longer say the tag is pending.
          readme_path = Path("/tmp/README.md")
          readme = readme_path.read_text()
          readme = replace_once(
              readme,
              "The v0.1 BAM/CPU release candidate is implemented and has passed its product-SHA validation gates. Release evidence is being validated before the `v0.1.0` tag is created.",
              "AlignGauge `v0.1.0` is released. The release tag is pinned by policy to validated evidence SHA `9423a9d3496459fdbceb2e7bc5178b4b3100357c` (product implementation SHA `f93001cf22a2315f01e6b857c295720d99e392ca`). Later commits on `master` may contain post-release documentation and are not part of the tagged release.",
              "README release status",
          )
          readme_path.write_text(readme)

          # Release checklist: record the exact evidence-SHA validation and publication.
          checklist_path = Path("/tmp/V0_1_RELEASE_CHECKLIST.md")
          checklist = checklist_path.read_text()
          checklist = replace_once(
              checklist,
              "The release tag is intentionally pending until the evidence commit containing this checklist passes exact-SHA validation.",
              "Release `v0.1.0` was published on 2026-08-07 and the tag points exactly to validated evidence SHA `9423a9d3496459fdbceb2e7bc5178b4b3100357c`. Post-release documentation commits on `master` are intentionally outside the tagged release.",
              "release checklist pending sentence",
          )

          evidence_block = f"""## Required evidence-SHA gates\n\nAll four evidence-SHA gates succeeded on `{release_sha}` before publication:\n\n- [x] Permanent CI — run `31163469057`, job `92818867067`.\n- [x] Full Runtime Validation — run `31163469075`, job `92818867219`.\n- [x] Reference Validation — run `31163469014`, job `92818866656`.\n- [x] HG002 Preparation Validation — run `31163468950`, job `92818866320`.\n- [x] HG002 evidence artifact — ID `8988064820`, digest `sha256:b475363f37ab9cba171d127c7a5ff37efaef2191bb405a341982a9694f7249c0`.\n\nThe one-time publisher then succeeded in run `31166976043`, job `92829955705`, and verified `refs/tags/v0.1.0 -> {release_sha}` after publication.\n\n"""
          marker = "## SPEC §19.1 acceptance\n"
          if "## Required evidence-SHA gates" in checklist:
              raise SystemExit("release checklist: evidence-SHA section already present")
          checklist = replace_once(checklist, marker, evidence_block + marker, "release checklist evidence marker")

          checklist = replace_once(
              checklist,
              "- [ ] Validate the evidence commit with Permanent CI, Full Runtime, Reference Validation, and HG002.\n- [ ] Only after that exact SHA is green, create tag/release `v0.1.0` pointing to the validated evidence SHA.\n- [ ] Never move the release tag to an unvalidated commit.",
              f"- [x] Validated evidence SHA `{release_sha}` with Permanent CI, Full Runtime Validation, Reference Validation, and HG002 Preparation Validation.\n- [x] Created tag/release `v0.1.0` only after those exact-SHA gates were green; both the release target and Git ref resolve to `{release_sha}`.\n- [x] Release policy keeps `v0.1.0` pinned to `{release_sha}`; post-release documentation commits do not move the tag.",
              "release checklist tag rule",
          )
          checklist_path.write_text(checklist)

          # TODO: close only Milestone 6. Do not alter later-release or global-rule checkboxes.
          todo_path = Path("/tmp/DNA_QC_ENGINE_TODO.md")
          todo = todo_path.read_text()
          todo = replace_once(
              todo,
              "**Status:** Ralph Loop active — Milestone 5 complete; Milestone 6 next",
              "**Status:** Ralph Loop active — `v0.1.0` released; Milestone 6 complete; Milestone 7 next",
              "TODO top status",
          )
          todo = replace_once(todo, "**Last updated:** 2026-08-06", "**Last updated:** 2026-08-07", "TODO last-updated date")

          start_marker = "## Milestone 6 — v0.1 release integration\n"
          end_marker = "# Part II — v0.2 CRAM and reference integrity\n"
          start = todo.find(start_marker)
          end = todo.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0:
              raise SystemExit("TODO: could not isolate Milestone 6")
          section = todo[start:end]
          if "**Status:** Complete" in section:
              raise SystemExit("TODO: Milestone 6 already has a completion status")
          unchecked = section.count("- [ ]")
          if unchecked < 30:
              raise SystemExit(f"TODO: expected at least 30 Milestone 6 unchecked tasks, found {unchecked}")
          status = (
              f"**Status:** Complete — product SHA `{product_sha}`; validated evidence/release SHA `{release_sha}`; "
              "`v0.1.0` published after Permanent CI, Full Runtime Validation, Reference Validation, and HG002 Preparation Validation all succeeded on the exact release SHA.\n\n"
          )
          section = section.replace(start_marker, start_marker + "\n" + status, 1)
          section = section.replace("- [ ]", "- [x]")
          todo = todo[:start] + section + todo[end:]
          todo_path.write_text(todo)
          print(f"Closed {unchecked} Milestone 6 checklist items.")
          PY

          create_blob() {
            local file="$1"
            local payload
            payload="$(jq -Rs '{content: ., encoding: "utf-8"}' < "${file}")"
            curl --fail --silent --show-error -X POST "${auth[@]}" \
              "${api}/git/blobs" -d "${payload}" | jq -r '.sha'
          }

          readme_blob="$(create_blob /tmp/README.md)"
          checklist_blob="$(create_blob /tmp/V0_1_RELEASE_CHECKLIST.md)"
          todo_blob="$(create_blob /tmp/DNA_QC_ENGINE_TODO.md)"

          tree_payload="$(jq -n \
            --arg base "${base_tree}" \
            --arg readme "${readme_blob}" \
            --arg checklist "${checklist_blob}" \
            --arg todo "${todo_blob}" \
            '{base_tree:$base,tree:[
              {path:"README.md",mode:"100644",type:"blob",sha:$readme},
              {path:"docs/evidence/V0_1_RELEASE_CHECKLIST.md",mode:"100644",type:"blob",sha:$checklist},
              {path:"docs/DNA_QC_ENGINE_TODO.md",mode:"100644",type:"blob",sha:$todo},
              {path:".github/workflows/one-time-v0.1.0-release.yml",mode:"100644",type:"blob",sha:null}
            ]}')"
          new_tree="$(curl --fail --silent --show-error -X POST "${auth[@]}" \
            "${api}/git/trees" -d "${tree_payload}" | jq -r '.sha')"

          commit_payload="$(jq -n \
            --arg message "docs: close v0.1.0 release" \
            --arg tree "${new_tree}" \
            --arg parent "${head_sha}" \
            '{message:$message,tree:$tree,parents:[$parent]}')"
          new_commit="$(curl --fail --silent --show-error -X POST "${auth[@]}" \
            "${api}/git/commits" -d "${commit_payload}" | jq -r '.sha')"

          ref_payload="$(jq -n --arg sha "${new_commit}" '{sha:$sha,force:false}')"
          curl --fail --silent --show-error -X PATCH "${auth[@]}" \
            "${api}/git/refs/heads/master" -d "${ref_payload}" > /tmp/ref-update.json
          actual="$(jq -r '.object.sha' /tmp/ref-update.json)"
          [[ "${actual}" == "${new_commit}" ]]
          echo "Closure commit: ${new_commit}"
