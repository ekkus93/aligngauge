name: One-time v0.1.0 release publisher

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-time-v0.1.0-release.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: release/v0.1.0
    if: github.repository == 'ekkus93/aligngauge'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 9423a9d3496459fdbceb2e7bc5178b4b3100357c
      TAG_NAME: v0.1.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Revalidate exact release SHA
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          runs="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/runs?head_sha=${TARGET_SHA}&per_page=100")"

          required=(
            "Permanent CI"
            "Full Runtime Validation"
            "Reference Validation"
            "M2 HG002 Preparation Validation"
          )

          for workflow in "${required[@]}"; do
            count="$(jq --arg workflow "${workflow}" --arg sha "${TARGET_SHA}" \
              '[.workflow_runs[] | select(.name == $workflow and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | length' \
              <<<"${runs}")"
            if [[ "${count}" -lt 1 ]]; then
              echo "Required exact-SHA workflow is not successful: ${workflow}" >&2
              exit 1
            fi
          done

      - name: Refuse an existing tag or release
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"

          tag_status="$(curl --silent --show-error --output /tmp/tag.json --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/ref/tags/${TAG_NAME}")"
          if [[ "${tag_status}" != "404" ]]; then
            echo "Refusing to publish: tag ${TAG_NAME} already exists (HTTP ${tag_status})." >&2
            cat /tmp/tag.json >&2
            exit 1
          fi

          release_status="$(curl --silent --show-error --output /tmp/release.json --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/releases/tags/${TAG_NAME}")"
          if [[ "${release_status}" != "404" ]]; then
            echo "Refusing to publish: release ${TAG_NAME} already exists (HTTP ${release_status})." >&2
            cat /tmp/release.json >&2
            exit 1
          fi

      - name: Create v0.1.0 release at validated SHA
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          body="$(cat <<'EOF'
          AlignGauge v0.1.0 is the validated BAM/CPU foundation release.

          Release/evidence SHA: `9423a9d3496459fdbceb2e7bc5178b4b3100357c`
          Product implementation SHA: `f93001cf22a2315f01e6b857c295720d99e392ca`

          v0.1 includes local coordinate-sorted BAM analysis, deterministic CPU alignment/per-reference counters, exact canonical coverage, JSON/provenance output, atomic publication, explicit diagnostics, differential validation, HG002 subset validation, and a measured performance baseline.

          Deferred beyond v0.1: CRAM/reference resolution, targeted/BED metrics, GPU/backend selection, exact mate-overlap correction, and indexed multi-reader parallelism.

          Evidence is committed under `docs/evidence/` in the tagged tree.
          EOF
          )"

          payload="$(jq -n \
            --arg tag "${TAG_NAME}" \
            --arg target "${TARGET_SHA}" \
            --arg name "AlignGauge v0.1.0" \
            --arg body "${body}" \
            '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false,generate_release_notes:false}')"

          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/releases" \
            -d "${payload}" \
            > /tmp/created-release.json

          jq '{id,tag_name,target_commitish,name,draft,prerelease,html_url}' /tmp/created-release.json

      - name: Verify immutable release target
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          ref="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/ref/tags/${TAG_NAME}")"
          actual="$(jq -r '.object.sha' <<<"${ref}")"
          if [[ "${actual}" != "${TARGET_SHA}" ]]; then
            echo "Release tag points to ${actual}, expected ${TARGET_SHA}." >&2
            exit 1
          fi
          echo "${TAG_NAME} -> ${actual}"
