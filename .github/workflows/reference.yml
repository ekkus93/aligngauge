name: Reference Validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  samtools:
    name: ci/reference
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify committed fixture identity
        run: cargo run -p aligngauge-testkit --locked -- verify-manifest --root .

      - name: Run exact counter differential suite
        run: tools/reference/samtools/compare-counters.sh

      - name: Run digest-pinned coverage baseline
        run: |
          tools/reference/samtools/run-reference.sh \
            depth \
            testdata/fixtures/basic.bam \
            target/reference/basic-depth

      - name: Validate complete captures
        run: |
          test -f target/reference/m4-counters/basic/_SUCCESS
          test -f target/reference/m4-counters/flags_and_pairs/_SUCCESS
          test -f target/reference/basic-depth/_SUCCESS
          grep -F 'samtools 1.24' \
            target/reference/m4-counters/basic/reference-flagstat/version.txt
          grep -F 'sha256:a130447589651ed09252aa95a5e4f4132942cdb54d835d81a04a9a930d656561' \
            target/reference/m4-counters/basic/reference-flagstat/image.txt
