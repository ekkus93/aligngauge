name: M10 MultiQC parser probe

on:
  push:
    branches:
      - milestone-10-samtools-stats
    paths:
      - .github/workflows/m10-multiqc-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and compare synthetic compatibility text
        run: |
          set -euo pipefail
          cargo build -q -p aligngauge-cli
          mkdir -p /tmp/m10/samtools /tmp/m10/ref-input /tmp/m10/ag-input
          bash tools/reference/samtools/run-stats.sh testdata/fixtures/flags_and_pairs.bam /tmp/m10/samtools
          target/debug/aligngauge qc --input testdata/fixtures/flags_and_pairs.bam --format samtools-stats > /tmp/m10/aligngauge.stats
          python tools/reference/samtools/compare-stats.py /tmp/m10/samtools/stdout.txt /tmp/m10/aligngauge.stats /tmp/m10/differential.json
          cp /tmp/m10/samtools/stdout.txt /tmp/m10/ref-input/sample.samtools.stats
          cp /tmp/m10/aligngauge.stats /tmp/m10/ag-input/sample.samtools.stats
          cat /tmp/m10/differential.json
      - name: Run actual MultiQC 1.35 parser twice
        run: |
          set -euo pipefail
          source tools/reference/multiqc/image.lock
          [[ "$MULTIQC_VERSION" == "1.35" ]]
          docker pull "$MULTIQC_IMAGE" >/dev/null
          docker run --rm --network none -v /tmp/m10:/work "$MULTIQC_IMAGE" \
            multiqc -f -m samtools -o /work/ref-out /work/ref-input
          docker run --rm --network none -v /tmp/m10:/work "$MULTIQC_IMAGE" \
            multiqc -f -m samtools -o /work/ag-out /work/ag-input
          echo '===== files ====='
          find /tmp/m10/ref-out /tmp/m10/ag-out -maxdepth 3 -type f -printf '%p\n' | sort
          echo '===== reference samtools data ====='
          find /tmp/m10/ref-out -type f -name 'multiqc_samtools_stats*' -print -exec cat {} \;
          echo '===== aligngauge samtools data ====='
          find /tmp/m10/ag-out -type f -name 'multiqc_samtools_stats*' -print -exec cat {} \;
          echo '===== insert-size references in data json ====='
          grep -n -i -m 20 'insert' /tmp/m10/ref-out/multiqc_data/multiqc_data.json || true
          echo '===== insert-size aligngauge in data json ====='
          grep -n -i -m 20 'insert' /tmp/m10/ag-out/multiqc_data/multiqc_data.json || true
