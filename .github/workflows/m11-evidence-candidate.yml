name: M11 Evidence Candidate

on:
  push:
    branches:
      - milestone-11-picard-profiles
    paths:
      - .github/workflows/m11-evidence-candidate.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile M11 TODO and CLI documentation
        run: python3 scripts/m11_evidence_candidate.py
      - name: Verify documentation diff
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          [[ "${#changed[@]}" -eq 2 ]]
          [[ " ${changed[*]} " == *" crates/aligngauge-cli/README.md "* ]]
          [[ " ${changed[*]} " == *" docs/DNA_QC_ENGINE_TODO.md "* ]]
      - name: Commit evidence-candidate reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/aligngauge-cli/README.md docs/DNA_QC_ENGINE_TODO.md
          git commit -m 'docs: reconcile Milestone 11 evidence candidate'
          git push origin HEAD:milestone-11-picard-profiles
