name: Milestone 9 targeted BAM CRAM equivalence

on:
  push:
    branches:
      - milestone-9-targeted-metrics
    paths:
      - .github/workflows/m9-cram-targeted-build.yml
      - .github/m9-cram-targeted.py

permissions:
  contents: write

jobs:
  validate:
    name: m9/bam-cram-targeted
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Apply targeted equivalence test
        run: python .github/m9-cram-targeted.py
      - name: Format workspace
        run: cargo fmt --all
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run targeted BAM CRAM equivalence
        run: cargo test -p aligngauge-cli --test cram_v0_2 --all-features targeted_bam_and_cram_have_identical_canonical_results -- --nocapture
      - name: Run workspace tests
        run: cargo test --workspace --all-features
      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          [[ "${changed}" == "crates/aligngauge-cli/tests/cram_v0_2.rs" ]] || { git status --short; exit 1; }
      - name: Commit validated equivalence test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/aligngauge-cli/tests/cram_v0_2.rs
          git commit -m 'test: prove targeted BAM CRAM equivalence'
          git push origin HEAD:milestone-9-targeted-metrics
