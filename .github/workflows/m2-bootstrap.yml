name: M2 Bootstrap

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/m2-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m2-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Apply compiler repair
        run: python tools/m2_fix1.py

      - name: Apply documentation corrections
        run: python tools/m2_patch_docs.py

      - name: Resolve and lock dependencies
        run: cargo update --workspace

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Generate deterministic corpus
        run: cargo run -p aligngauge-testkit --locked -- generate-corpus --root .

      - name: Verify committed corpus manifest
        run: cargo run -p aligngauge-testkit --locked -- verify-manifest --root .

      - name: Validate ADR numbering and shell syntax
        run: |
          grep -F 'ADR-0003-COVERAGE_BASELINE.md' docs/DNA_QC_ENGINE_TODO.md
          grep -F 'ADR-0004-CRAM_REFERENCE_RESOLUTION.md' docs/DNA_QC_ENGINE_TODO.md
          bash -n tools/reference/samtools/run-reference.sh
          bash -n tools/reference/samtools/run-baselines.sh
          bash -n testdata/hg002/prepare.sh

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Run digest-pinned network-isolated reference tools
        run: |
          tools/reference/samtools/run-baselines.sh \
            testdata/fixtures/basic.bam \
            target/reference/basic
          test -f target/reference/basic/flagstat/_SUCCESS
          test -f target/reference/basic/idxstats/_SUCCESS
          test -f target/reference/basic/depth/_SUCCESS

      - name: Validate diff
        run: git diff --check

      - name: Commit validated Milestone 2 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "testkit: add deterministic Milestone 2 corpus"
          git push origin HEAD:master
