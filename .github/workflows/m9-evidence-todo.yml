name: One-time Milestone 9 evidence closer

on:
  push:
    branches:
      - milestone-9-targeted-metrics
    paths:
      - .github/workflows/m9-evidence-todo.yml
      - .github/m9-evidence-todo.py

permissions:
  contents: write

jobs:
  close:
    name: docs/m9-evidence-state
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Update exact Milestone 9 TODO state
        run: python .github/m9-evidence-todo.py

      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          [[ "${changed}" == "docs/DNA_QC_ENGINE_TODO.md" ]] || { git status --short; exit 1; }

      - name: Commit evidence-state TODO
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DNA_QC_ENGINE_TODO.md
          git commit -m 'docs: record Milestone 9 evidence state'
          git push origin HEAD:milestone-9-targeted-metrics
