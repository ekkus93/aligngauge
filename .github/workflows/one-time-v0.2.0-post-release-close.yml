name: One-time v0.2.0 post-release closure

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-time-v0.2.0-post-release-close.yml

permissions:
  contents: write

jobs:
  close:
    name: docs/v0.2.0-closure
    if: github.repository == 'ekkus93/aligngauge'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ce3aa273da40c679c292e588584781ab1df241de
      TAG_NAME: v0.2.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Verify published release remains pinned
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          ref="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/ref/tags/${TAG_NAME}")"
          actual="$(jq -r '.object.sha' <<<"${ref}")"
          [[ "${actual}" == "${TARGET_SHA}" ]] || { echo "${TAG_NAME} points to ${actual}, expected ${TARGET_SHA}" >&2; exit 1; }

          release="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/releases/tags/${TAG_NAME}")"
          [[ "$(jq -r '.id' <<<"${release}")" == "366847969" ]] || { echo "unexpected release id" >&2; exit 1; }
          [[ "$(jq -r '.target_commitish' <<<"${release}")" == "${TARGET_SHA}" ]] || { echo "release target changed" >&2; exit 1; }
          [[ "$(jq -r '.draft' <<<"${release}")" == "false" ]] || { echo "release is draft" >&2; exit 1; }
          [[ "$(jq -r '.prerelease' <<<"${release}")" == "false" ]] || { echo "release is prerelease" >&2; exit 1; }

      - name: Close v0.2 documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'docs/DNA_QC_ENGINE_TODO.md',
              '**Status:** Ralph Loop active — `v0.1.0` released; Milestone 7 implementation/evidence complete; v0.2 release gate remains open',
              '**Status:** Ralph Loop active — `v0.2.0` released; Milestone 7 complete; Milestone 8 next',
          )
          replace_once(
              'docs/DNA_QC_ENGINE_TODO.md',
              '**Status:** Implementation complete — validated implementation SHA `cf288efe8ffdc3542abedc95404bc6602515da4a`; Permanent CI run `31184689945`, job `92886187241`; Full Runtime Validation run `31184688346`, job `92886217801`; Reference Validation run `31184688367`, job `92886248460`; all successful. v0.2 release remains open pending the release-scope reconciliation below.',
              '**Status:** Complete — `v0.2.0` released at exact release/evidence SHA `ce3aa273da40c679c292e588584781ab1df241de`; validated implementation SHA `cf288efe8ffdc3542abedc95404bc6602515da4a`; final PR/spec SHA `2e1aa87906868da2c0d198ac634997b5ce4d029e`; merge SHA `72dc4ca1fb64c5f49be984ed9c2fac99e0cb64b0`. Exact release-SHA gates: Permanent CI run `31193332229`, job `92915384822`; Full Runtime Validation run `31193331338`, job `92915383627`; Reference Validation run `31193332153`, job `92915384352`; M2 HG002 Preparation Validation run `31193331148`, job `92915380902`; all successful. Release publisher run `31193684743`, job `92916563597`, success.',
          )
          replace_once(
              'docs/DNA_QC_ENGINE_TODO.md',
              '- [ ] Permanent CI succeeds on the exact release commit.',
              '- [x] Permanent CI succeeds on the exact release commit.',
          )

          replace_once(
              'docs/evidence/V0_2_CRAM_VALIDATION.md',
              '**Disposition:** Milestone 7 implementation tasks 7.1–7.4 are complete. This document does **not** declare the v0.2 release gate closed.',
              '**Disposition:** Complete — `v0.2.0` is released and pinned by release policy to exact release/evidence SHA `ce3aa273da40c679c292e588584781ab1df241de`.',
          )
          replace_once(
              'docs/evidence/V0_2_CRAM_VALIDATION.md',
              'This satisfies the security intent without mutating process-global state. The literal wording difference from SPEC §8 is recorded as an open release-scope reconciliation item rather than hidden.',
              'This satisfies the security intent without mutating process-global state. SPEC §8 was subsequently reconciled with ADR-0004 so the normative contract now explicitly requires scoped provider neutralization rather than race-prone process-global environment mutation.',
          )
          replace_once(
              'docs/evidence/V0_2_CRAM_VALIDATION.md',
              'These reconciliations do not themselves declare v0.2 released. The remaining release gate is Permanent CI on the eventual exact release commit, followed by the repository\'s normal merge/tag/release discipline. No tag or v0.2 release claim is made by this evidence document.',
              '''These reconciliations were completed and validated before release. The exact release target then passed the permanent release gates and was published without moving the validated target.\n\n## 11. v0.2.0 release closure\n\n`v0.2.0` was published on 2026-08-07 as GitHub release ID `366847969`. The tag is pinned by release policy to exact release/evidence SHA `ce3aa273da40c679c292e588584781ab1df241de`. Independent post-publication verification confirmed that both `refs/tags/v0.2.0` and the GitHub release `target_commitish` identify that exact commit.\n\nExact release-SHA validation:\n\n| Gate | Run | Job | Result |\n| --- | --- | --- | --- |\n| Permanent CI | `31193332229` | `92915384822` | success |\n| Full Runtime Validation | `31193331338` | `92915383627` | success |\n| Reference Validation | `31193332153` | `92915384352` | success |\n| M2 HG002 Preparation Validation | `31193331148` | `92915380902` | success |\n\nThe one-time publisher revalidated those exact-SHA workflows, refused any pre-existing tag or release, created the release at the pinned SHA, and verified the resulting tag and release target in run `31193684743`, job `92916563597` (success). The publisher was removed after publication.\n\nMilestone 7 and the v0.2 release gate are therefore complete. Later commits on `master` may update documentation and begin Milestone 8; they do not move or redefine the `v0.2.0` tag.''',
          )

          replace_once(
              'README.md',
              'AlignGauge `v0.1.0` is released and remains the latest published tag while the `v0.2.0` release candidate completes exact-SHA validation. The v0.1 tag is pinned by release policy to validated evidence SHA `9423a9d3496459fdbceb2e7bc5178b4b3100357c` (product implementation SHA `f93001cf22a2315f01e6b857c295720d99e392ca`).',
              'AlignGauge `v0.2.0` is released. The v0.2 tag is pinned by release policy to exact release/evidence SHA `ce3aa273da40c679c292e588584781ab1df241de`. The earlier v0.1 tag remains pinned by release policy to validated evidence SHA `9423a9d3496459fdbceb2e7bc5178b4b3100357c` (product implementation SHA `f93001cf22a2315f01e6b857c295720d99e392ca`).',
          )
          replace_once(
              'README.md',
              'The v0.2 CRAM/reference-integrity implementation and its specification reconciliation were merged to `master` at `72dc4ca1fb64c5f49be984ed9c2fac99e0cb64b0`. The `v0.2.0` tag is intentionally pending until the release-candidate commit containing this status and the committed v0.2 evidence passes the permanent exact-SHA release gates.',
              'The v0.2 CRAM/reference-integrity implementation and specification reconciliation were merged to `master` at `72dc4ca1fb64c5f49be984ed9c2fac99e0cb64b0`. The exact release target `ce3aa273da40c679c292e588584781ab1df241de` passed Permanent CI, Full Runtime Validation, Reference Validation, and HG002 Preparation Validation before `v0.2.0` was published.',
          )
          replace_once('README.md', '- v0.2 release candidate:', '- v0.2:')
          replace_once(
              'README.md',
              '- [v0.1.0 release](https://github.com/ekkus93/aligngauge/releases/tag/v0.1.0)',
              '- [v0.2.0 release](https://github.com/ekkus93/aligngauge/releases/tag/v0.2.0)\n- [v0.1.0 release](https://github.com/ekkus93/aligngauge/releases/tag/v0.1.0)',
          )

          replace_once(
              'crates/aligngauge-cli/README.md',
              'Permanent runtime and release E2E validation exercise the compatibility and release paths independently so compatibility behavior cannot silently acquire release-mode requirements. v0.2 CRAM/reference evidence is recorded in `docs/evidence/V0_2_CRAM_VALIDATION.md`; the `v0.2.0` tag is created only after the exact release-candidate commit passes the permanent validation gates.',
              'Permanent runtime and release E2E validation exercise the compatibility and release paths independently so compatibility behavior cannot silently acquire release-mode requirements. v0.2 CRAM/reference evidence is recorded in `docs/evidence/V0_2_CRAM_VALIDATION.md`. `v0.2.0` is released and pinned by release policy to exact validated release/evidence SHA `ce3aa273da40c679c292e588584781ab1df241de`.',
          )
          PY

          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' README.md crates/aligngauge-cli/README.md docs/DNA_QC_ENGINE_TODO.md docs/evidence/V0_2_CRAM_VALIDATION.md | sort)"
          if [[ "${changed}" != "${expected}" ]]; then
            echo 'unexpected post-release documentation changes:' >&2
            git status --short >&2
            exit 1
          fi

      - name: Commit post-release closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md crates/aligngauge-cli/README.md docs/DNA_QC_ENGINE_TODO.md docs/evidence/V0_2_CRAM_VALIDATION.md
          git commit -m 'docs: close v0.2.0 release'
          git push origin HEAD:master
