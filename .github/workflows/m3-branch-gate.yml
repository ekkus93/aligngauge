name: M3 Branch Gate

on:
  push:
    branches: [agent/milestone-3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3-branch-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out work branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Apply strict Clippy fixes
        run: python tools/m3_apply_fixes.py

      - name: Format source
        run: cargo fmt --all

      - name: Resolve local workspace lock changes
        run: cargo check --workspace --all-targets

      - name: Verify dependency lockfile
        run: cargo update --workspace --locked --dry-run

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify generated corpus is unchanged
        run: |
          regenerated="$(mktemp -d)"
          trap 'rm -rf "$regenerated"' EXIT
          cargo run -p aligngauge-testkit --locked -- generate-corpus --root "$regenerated"
          diff -ru -- testdata/fixtures "$regenerated/testdata/fixtures"
          diff -ru -- testdata/expected "$regenerated/testdata/expected"
          diff -u -- testdata/manifest.v1.tsv "$regenerated/testdata/manifest.v1.tsv"

      - name: Validate diff
        run: git diff --check

      - name: Publish validated branch state
        run: |
          rm tools/m3_apply_fixes.py
          rm .github/workflows/m3-branch-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add production BAM validation boundary"
          git push origin HEAD:agent/milestone-3
