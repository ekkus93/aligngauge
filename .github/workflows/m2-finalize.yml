name: M2 Finalize

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/m2-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m2-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Create final Milestone 2 evidence
        run: python tools/m2_finalize.py

      - name: Validate final documentation diff
        run: |
          test -f docs/evidence/M2_TEST_CORPUS.md
          grep -F 'Milestone 2 complete; Milestone 3 next' docs/DNA_QC_ENGINE_TODO.md
          grep -F '**Implementation SHA:** `45211236419e5bebc7c0d09d5cb35d65174cc11a`' \
            docs/evidence/M2_TEST_CORPUS.md
          test ! -e tools/m2_finalize.py
          test ! -e .github/workflows/m2-finalize.yml
          git diff --check

      - name: Commit final Milestone 2 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: complete Milestone 2 evidence"
          git push origin HEAD:master
