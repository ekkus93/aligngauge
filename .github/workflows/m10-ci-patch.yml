name: M10 permanent CI patch

on:
  push:
    branches:
      - milestone-10-samtools-stats
    paths:
      - .github/m10-ci-patch.py
      - .github/workflows/m10-ci-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply and validate permanent CI hooks
        run: |
          set -euo pipefail
          python .github/m10-ci-patch.py
          bash -n tools/reference/samtools/run-stats.sh
          bash -n tools/reference/multiqc/validate-samtools-stats.sh
          python -m py_compile tools/reference/samtools/compare-stats.py
          git diff --check
      - name: Commit permanent CI hooks and remove probe machinery
        run: |
          set -euo pipefail
          git rm -f \
            .github/m10-ci-patch.py \
            .github/workflows/m10-ci-patch.yml \
            .github/workflows/m10-multiqc-probe.yml
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            .github/m10-ci-patch.py \
            .github/workflows/m10-ci-patch.yml \
            .github/workflows/m10-multiqc-probe.yml \
            .github/workflows/ci.yml | sort)"
          [[ "$changed" == "$expected" ]] || { git status --short; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: validate Samtools stats reference tooling permanently'
          git push origin HEAD:milestone-10-samtools-stats
