name: M6 Import Repair

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/m6-import-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: m6/import-repair
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Apply exact import repair
        run: |
          python tools/m6_import_repair.py
          cargo fmt --all
          git rm .github/workflows/m6-import-repair.yml tools/m6_import_repair.py
          git diff --check
      - name: Reject unexpected changes
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              "crates/aligngauge-cli/src/lib.rs",
              "crates/aligngauge-cli/src/main.rs",
              ".github/workflows/m6-import-repair.yml",
              "tools/m6_import_repair.py",
          }
          output = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True)
          paths = set()
          for line in output.splitlines():
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              paths.add(path)
          if paths != allowed:
              raise SystemExit(f"unexpected M6 import-repair paths: {sorted(paths)}")
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/aligngauge-cli/src/lib.rs crates/aligngauge-cli/src/main.rs
          git commit -m "fix: import canonical JSON trait for release output"
          git push origin HEAD:master
