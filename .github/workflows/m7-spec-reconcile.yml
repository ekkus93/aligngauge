name: M7 spec reconciliation

on:
  push:
    branches: [milestone-7-cram]
    paths:
      - .github/workflows/m7-spec-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Reconcile v0.2 normative scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          spec = Path('docs/DNA_QC_ENGINE_SPEC.md')
          text = spec.read_text()

          old_42 = '''### 4.2 v0.2 — CRAM and reference integrity

          v0.2 adds:

          - CRAM input through a pinned HTSlib/rust-htslib version;
          - mandatory local-reference resolution;
          - remote reference retrieval disabled unconditionally;
          - reference identity and MD5 validation;
          - BAM/CRAM equivalence testing;
          - `inspect` and `validate-reference` workflows;
          - CRAM corruption and missing-reference fixtures.
          '''
          new_42 = '''### 4.2 v0.2 — CRAM and reference integrity

          v0.2 adds:

          - CRAM input through a pinned HTSlib/rust-htslib version;
          - mandatory explicit local-reference resolution for CRAM analysis;
          - remote reference retrieval disabled unconditionally;
          - reference identity and MD5 validation;
          - BAM/CRAM equivalence testing;
          - CRAM corruption and missing-reference fixtures.

          Standalone `inspect` and `validate-reference` commands are **not** v0.2
          release requirements. The v0.2 integrity contract is enforced through the
          released `qc --reference <FASTA>` path and the shared reference-validation
          API. Dedicated inspection/validation workflows are deferred until their CLI,
          output-schema, and error contracts are specified and tested as independent
          product surfaces.
          '''
          if text.count(old_42) != 1:
              raise SystemExit(f'expected one §4.2 block, found {text.count(old_42)}')
          text = text.replace(old_42, new_42, 1)

          old_8 = '''## 8. v0.2 CRAM reference contract

          This section is normative for v0.2 and shall influence the v0.1 I/O boundary.

          Before opening any CRAM handle, AlignGauge shall configure HTSlib for local-only
          reference resolution.

          Requirements:

          - pin the exact HTSlib/rust-htslib version;
          - verify that `REF_PATH`, `REF_CACHE`, and any version-specific reference provider
            cannot trigger remote retrieval;
          - override inherited environment state with local-only values;
          - prohibit HTTP/HTTPS reference resolution;
          - run CRAM differential tests in a network-disabled sandbox;
          - fail if a required sequence cannot be resolved locally;
          - name the missing contig and expected MD5 in the diagnostic where available;
          - record the actual FASTA identity and per-contig validation in provenance.

          A supplied but mismatched FASTA shall not cause fallback to another local or remote
          reference.
          '''
          new_8 = '''## 8. v0.2 CRAM reference contract

          This section is normative for v0.2 and shall influence the v0.1 I/O boundary.

          Before reference-dependent CRAM record decoding, AlignGauge shall establish a
          fail-closed local-only reference policy. The implementation shall not rely on
          process-global environment mutation when inherited provider state can instead be
          made non-authoritative by construction.

          Opening a local CRAM container far enough to read its header and obtain `@SQ`
          reference requirements is permitted before FASTA validation, provided the pinned
          production HTSlib build has no remote reference transport and record traversal has
          not begun.

          Requirements:

          - pin the exact HTSlib/rust-htslib version;
          - verify version-specific `REF_PATH`, `REF_CACHE`, `HTS_PATH`, metadata/provider,
            and MD5-lookup behavior that could otherwise influence reference selection;
          - compile the production HTSlib stack without HTTP/HTTPS or other remote reference
            transport features;
          - require an explicit local FASTA for CRAM analysis;
          - validate required contig names, lengths, and `M5` identities against that FASTA
            before reference-dependent record traversal;
          - ensure inherited provider state cannot select an alternate reference after the
            explicit FASTA is supplied;
          - prohibit fallback from a supplied but mismatched FASTA to any other local or
            remote reference;
          - run the hostile-provider CRAM case in a network-disabled sandbox and observe
            network syscalls where the platform supports it;
          - fail if a required sequence cannot be resolved locally;
          - name the missing contig and expected MD5 in the diagnostic where available;
          - record the actual FASTA identity and per-contig validation in provenance.

          Process-global mutation of `REF_PATH`, `REF_CACHE`, or `HTS_PATH` is not required
          and should be avoided when it would introduce race-prone global state. The release
          evidence shall instead prove that hostile inherited values are non-authoritative
          and that the CRAM reference-resolution path cannot access the network.
          '''
          if text.count(old_8) != 1:
              raise SystemExit(f'expected one §8 block, found {text.count(old_8)}')
          text = text.replace(old_8, new_8, 1)
          spec.write_text(text)

          todo = Path('docs/DNA_QC_ENGINE_TODO.md')
          text = todo.read_text()
          old_gate = '''- [x] Create `docs/evidence/V0_2_CRAM_VALIDATION.md`.
          - [ ] Reconcile SPEC §4.2 `inspect` / `validate-reference` workflow scope before declaring v0.2 complete.
          - [ ] Reconcile SPEC §8 inherited-environment wording with ADR-0004 scoped neutralization, or amend the specification.
          - [ ] Permanent CI succeeds on the exact release commit.'''
          new_gate = '''- [x] Create `docs/evidence/V0_2_CRAM_VALIDATION.md`.
          - [x] Reconcile SPEC §4.2: standalone `inspect` / `validate-reference` workflows are deferred beyond v0.2 until separately specified.
          - [x] Reconcile SPEC §8 with ADR-0004: use scoped provider neutralization rather than process-global environment mutation.
          - [ ] Permanent CI succeeds on the exact release commit.'''
          if text.count(old_gate) != 1:
              raise SystemExit(f'expected one v0.2 release gate, found {text.count(old_gate)}')
          text = text.replace(old_gate, new_gate, 1)
          todo.write_text(text)

          evidence = Path('docs/evidence/V0_2_CRAM_VALIDATION.md')
          text = evidence.read_text()
          old_evidence = '''## 10. Release-scope items intentionally left open

          Milestone 7 implementation evidence is complete, but the v0.2 release is **not** declared complete for two reasons:

          1. SPEC §4.2 says v0.2 adds `inspect` and `validate-reference` workflows. Those workflows are not implemented by Milestone 7 and are not listed in SPEC §19.2's v0.2 acceptance bullets. Their disposition must be explicitly reconciled before a v0.2 release claim.
          2. SPEC §8 literally says to override inherited reference environment state before opening CRAM. ADR-0004 implements the safer scoped-neutralization design instead. The specification should be amended or explicitly reconciled before release so normative text and implementation do not disagree.

          The final TODO release-gate item requiring Permanent CI on the exact release commit therefore remains unchecked. No tag, release, merge-to-master, or v0.2 completion claim is made by this evidence document.
          '''
          new_evidence = '''## 10. Release-scope reconciliation

          The two specification discrepancies identified during Milestone 7 evidence review are resolved explicitly:

          1. SPEC §4.2 now states that standalone `inspect` and `validate-reference` commands are not v0.2 release requirements. The released v0.2 reference-integrity surface is `qc --reference <FASTA>` plus the shared validation API. Dedicated commands are deferred until their CLI, schema, and error contracts are independently specified and tested.
          2. SPEC §8 now matches ADR-0004's scoped-neutralization design. The production build removes remote HTSlib transports; CRAM requires an explicit local FASTA; AlignGauge validates SN/LN/M5 before reference-dependent traversal; mismatch is terminal; and hostile inherited provider state is proven non-authoritative under network isolation. Process-global environment mutation is neither required nor desired.

          These reconciliations do not themselves declare v0.2 released. The remaining release gate is Permanent CI on the eventual exact release commit, followed by the repository's normal merge/tag/release discipline. No tag or v0.2 release claim is made by this evidence document.
          '''
          if text.count(old_evidence) != 1:
              raise SystemExit(f'expected one evidence reconciliation block, found {text.count(old_evidence)}')
          text = text.replace(old_evidence, new_evidence, 1)
          evidence.write_text(text)
          PY

          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' docs/DNA_QC_ENGINE_SPEC.md docs/DNA_QC_ENGINE_TODO.md docs/evidence/V0_2_CRAM_VALIDATION.md | sort)"
          if [[ "$changed" != "$expected" ]]; then
            echo 'unexpected reconciliation changes:' >&2
            git status --short >&2
            exit 1
          fi

      - name: Commit specification reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DNA_QC_ENGINE_SPEC.md docs/DNA_QC_ENGINE_TODO.md docs/evidence/V0_2_CRAM_VALIDATION.md
          git commit -m 'docs: reconcile v0.2 CRAM release scope'
          git push origin HEAD:milestone-7-cram
