name: M10 evidence TODO update

on:
  push:
    branches:
      - milestone-10-samtools-stats
    paths:
      - .github/m10-evidence-close.py
      - .github/workflows/m10-evidence-close.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply guarded TODO update
        run: |
          set -euo pipefail
          python .github/m10-evidence-close.py
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          [[ "$changed" == "docs/DNA_QC_ENGINE_TODO.md" ]] || { git status --short; exit 1; }
      - name: Commit TODO evidence state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DNA_QC_ENGINE_TODO.md
          git commit -m 'docs: record Milestone 10 pre-evidence validation'
          git push origin HEAD:milestone-10-samtools-stats
