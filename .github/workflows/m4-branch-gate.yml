name: M4 Branch Gate

on:
  push:
    branches: [agent/milestone-4]

permissions:
  contents: write

concurrency:
  group: m4-branch-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out work branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply Milestone 4 implementation
        run: |
          git show 9e64a34af76116138873ec77bc457d8ff7f5e273:tools/m4_apply.py.gz.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/m4_apply.py
          python /tmp/m4_apply.py
          python - <<'PY'
          from pathlib import Path

          model = Path("crates/aligngauge-core/src/model.rs")
          text = model.read_text(encoding="utf-8")
          old = "        let per_reference_counters = per_reference_counters;\n"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one redundant per-reference binding")
          model.write_text(text.replace(old, "", 1), encoding="utf-8")

          metrics = Path("crates/aligngauge-metrics/src/lib.rs")
          text = metrics.read_text(encoding="utf-8")
          old = '''fn percentage(value: u64, total: u64) -> String {
              if total == 0 {
                  String::from("N/A")
              } else {
                  format!("{:.2}%", (value as f64 / total as f64) * 100.0)
              }
          }
          '''
          new = '''fn percentage(value: u64, total: u64) -> String {
              if total == 0 {
                  return String::from("N/A");
              }

              let numerator = u128::from(value) * 10_000;
              let hundredths = (numerator + (u128::from(total) / 2)) / u128::from(total);
              let whole = hundredths / 100;
              let fraction = hundredths % 100;
              format!("{whole}.{fraction:02}%")
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one floating percentage formatter")
          metrics.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format source
        run: cargo fmt --all

      - name: Resolve workspace lockfile
        run: cargo check --workspace --all-targets

      - name: Verify dependency lockfile
        run: cargo update --workspace --locked --dry-run

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Verify generated corpus is unchanged
        run: |
          cargo run -p aligngauge-testkit --locked -- generate-corpus --root .
          git diff --exit-code -- testdata

      - name: Run pinned Samtools counter differential
        run: tools/reference/samtools/compare-counters.sh

      - name: Validate and publish cleaned branch state
        run: |
          git diff --check
          rm .github/workflows/m4-branch-gate.yml tools/m4_apply.py.gz.b64
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add checked alignment counters'
          git push origin HEAD:agent/milestone-4
