name: M6 CLI Publish

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/m6-cli-publish.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Fetch exact validated source artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/m6-repair
          gh run download 31158499534 \
            --repo "$GITHUB_REPOSITORY" \
            --name m6-cli-repair-c93c3f3ad4c9e1600364c18acc56751debfff22a \
            --dir /tmp/m6-repair
          test -f /tmp/m6-repair/lib.rs
          test -f /tmp/m6-repair/main.rs
          echo 'bda3a356a3ce8964e539c790d4bb9db0c44bcc98c36c427667b651729951a815  /tmp/m6-repair/lib.rs' | sha256sum --check -
          echo '7810f85a04393d57d1b7dba21659a8ebb5ce4ba4ad33fb84b24c481de6913aba  /tmp/m6-repair/main.rs' | sha256sum --check -

      - name: Install exact validated sources
        run: |
          cp /tmp/m6-repair/lib.rs crates/aligngauge-cli/src/lib.rs
          cp /tmp/m6-repair/main.rs crates/aligngauge-cli/src/main.rs
          cargo fmt --all --check
          git diff --check

      - name: Commit source-only repair
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add crates/aligngauge-cli/src/lib.rs crates/aligngauge-cli/src/main.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore legacy CLI while integrating v0.1 release path'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
