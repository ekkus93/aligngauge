name: M7 minimal CLI repair

on:
  push:
    branches: [milestone-7-cram]
    paths:
      - .github/workflows/m7-main-minimal.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Restore v0.1 CLI structure and apply only CRAM deltas
        shell: bash
        run: |
          set -euo pipefail
          git show 4ea1744e27510198d1def23492cbf0fbf85c8081:crates/aligngauge-cli/src/main.rs \
            > crates/aligngauge-cli/src/main.rs
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/aligngauge-cli/src/main.rs')
          text = path.read_text()

          text = text.replace(
              'use aligngauge_cli::{analyze_bam, analyze_release};',
              'use aligngauge_cli::{analyze_bam, analyze_release_with_reference};',
          )
          text = text.replace(
              '''    Release {\n        config_path: Option<PathBuf>,\n        overrides: ConfigOverrides,''',
              '''    Release {\n        config_path: Option<PathBuf>,\n        reference: Option<PathBuf>,\n        overrides: ConfigOverrides,''',
              1,
          )
          text = text.replace(
              '''        Ok(CliAction::Release {\n            config_path,\n            overrides,''',
              '''        Ok(CliAction::Release {\n            config_path,\n            reference,\n            overrides:'''.replace('overrides:', 'overrides,'),
              1,
          )
          text = text.replace(
              'let report = match analyze_release(&config) {',
              'let report = match analyze_release_with_reference(&config, reference.as_deref()) {',
              1,
          )

          text = text.replace(
              '''    config_path: Option<PathBuf>,\n    compatibility_format: Option<CompatibilityFormat>,''',
              '''    config_path: Option<PathBuf>,\n    reference: Option<PathBuf>,\n    compatibility_format: Option<CompatibilityFormat>,''',
              1,
          )
          text = text.replace(
              '''            config_path: None,\n            compatibility_format: None,''',
              '''            config_path: None,\n            reference: None,\n            compatibility_format: None,''',
              1,
          )
          text = text.replace(
              '''        Ok(CliAction::Release {\n            config_path: self.config_path,\n            overrides: self.overrides,''',
              '''        Ok(CliAction::Release {\n            config_path: self.config_path,\n            reference: self.reference,\n            overrides: self.overrides,''',
              1,
          )

          old_reference = '''        Some("--reference") => Err(unsupported_option(\n            "--reference",\n            "CRAM reference resolution is a v0.2 feature",\n            program,\n        )),'''
          new_reference = '''        Some("--reference") => {\n            state.release_option_seen = true;\n            set_path_option(\n                &mut state.reference,\n                next_value(arguments, "--reference", program)?,\n                "--reference",\n                program,\n            )\n        }'''
          if old_reference not in text:
              raise SystemExit('expected --reference parser arm missing')
          text = text.replace(old_reference, new_reference, 1)

          text = text.replace(
              '"--format is a compatibility probe and cannot be combined with v0.1 release options"',
              '"--format is a compatibility probe and cannot be combined with release output options"',
          )
          text = text.replace(
              '"hardware/backend selection is not a released v0.1 feature"',
              '"hardware/backend selection is not released"',
          )
          text = text.replace(
              'format!("{option} is not supported in v0.1: {reason}"),',
              'format!("{option} is not supported by this release: {reason}"),',
          )

          old_usage = '''        "Usage:\\n  {0} qc --input <BAM> --outdir <DIR> [OPTIONS]\\n\\nRequired v0.1 values:\\n  --input <PATH>                  Local BAM input (may also come from --config)\\n  --outdir <PATH>                 New output directory (may also come from --config)\\n\\nOptional v0.1 values:\\n  --threads <N>                   Collector/reduction thread limit (v0.1 collector is deterministic serial)\\n  --io-threads <N>                HTSlib I/O workers; 0 or 1 selects serial decoding\\n  --memory-limit <SIZE>           B, KiB, MiB, GiB, or TiB (default 4GiB)\\n  --coverage-thresholds <LIST>    Comma-separated positive depths (default 1,10,20,30)\\n  --config <PATH>                 Strict schema_version=1 config file\\n  --log-format <human|json>       Diagnostic error format\\n  --quiet                         Suppress routine completion summary\\n  --verbose                       Enable verbose mode in resolved provenance\\n  --preserve-failed-staging       Preserve clearly incomplete staging on publication failure\\n  -h, --help                      Show this help\\n\\nConfiguration precedence:\\n  built-ins < config file < documented ALIGNGAUGE_* environment < CLI\\n\\nNot released in v0.1:\\n  --reference (v0.2 CRAM), --targets/--profile targeted (v0.3), --backend, --cuda-device\\n\\nLegacy three-counter compatibility probe:\\n  {0} qc --input <BAM>\\n\\nCompatibility projections retained for differential validation:\\n  {0} qc --input <BAM> --format <human|json|samtools-flagstat|samtools-idxstats>",'''
          new_usage = '''        "Usage:\\n  {0} qc --input <BAM|CRAM> --outdir <DIR> [OPTIONS]\\n\\nRequired release values:\\n  --input <PATH>                  Local BAM or CRAM input (may also come from --config)\\n  --outdir <PATH>                 New output directory (may also come from --config)\\n\\nCRAM reference integrity:\\n  --reference <FASTA>             Explicit local FASTA required for CRAM; remote lookup is disabled\\n\\nOptional values:\\n  --threads <N>                   Collector/reduction thread limit (collector is deterministic serial)\\n  --io-threads <N>                HTSlib I/O workers; 0 or 1 selects serial decoding\\n  --memory-limit <SIZE>           B, KiB, MiB, GiB, or TiB (default 4GiB)\\n  --coverage-thresholds <LIST>    Comma-separated positive depths (default 1,10,20,30)\\n  --config <PATH>                 Strict schema_version=1 config file\\n  --log-format <human|json>       Diagnostic error format\\n  --quiet                         Suppress routine completion summary\\n  --verbose                       Enable verbose mode in resolved provenance\\n  --preserve-failed-staging       Preserve clearly incomplete staging on publication failure\\n  -h, --help                      Show this help\\n\\nConfiguration precedence:\\n  built-ins < config file < documented ALIGNGAUGE_* environment < CLI\\n\\nDeferred beyond v0.2:\\n  --targets/--profile targeted (v0.3), --backend, --cuda-device\\n\\nLegacy BAM three-counter compatibility probe:\\n  {0} qc --input <BAM>\\n\\nBAM compatibility projections retained for differential validation:\\n  {0} qc --input <BAM> --format <human|json|samtools-flagstat|samtools-idxstats>",'''
          if old_usage not in text:
              raise SystemExit('expected v0.1 usage block missing')
          text = text.replace(old_usage, new_usage, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo fmt --all --check
          git diff --check

      - name: Validate minimal CLI against the complete workspace
        run: |
          cargo check --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked

      - name: Commit only the minimized CLI file
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^crates/aligngauge-cli/src/main.rs$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "unexpected product changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/aligngauge-cli/src/main.rs
          git commit -m 'refactor: preserve v0.1 CLI while adding CRAM reference'
          git push origin HEAD:milestone-7-cram
