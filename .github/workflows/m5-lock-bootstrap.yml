name: M5 Lockfile Bootstrap

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/m5-lock-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: m5/lockfile-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generate candidate workspace lockfile
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('Cargo.toml')
          text = root.read_text(encoding='utf-8')
          marker = '    "crates/aligngauge-core",\n'
          replacement = marker + '    "crates/aligngauge-coverage",\n'
          if replacement not in text:
              text = text.replace(marker, replacement, 1)
          root.write_text(text, encoding='utf-8')
          crate = Path('crates/aligngauge-coverage')
          (crate / 'src').mkdir(parents=True, exist_ok=True)
          (crate / 'Cargo.toml').write_text('''[package]\nname = "aligngauge-coverage"\nversion = "0.0.0"\ndescription = "Exact memory-planned coverage accumulation for AlignGauge"\nedition.workspace = true\nrust-version.workspace = true\nlicense.workspace = true\nrepository.workspace = true\npublish = false\n\n[dependencies]\naligngauge-core = { path = "../aligngauge-core" }\naligngauge-hts = { path = "../aligngauge-hts" }\n\n[lints]\nworkspace = true\n''', encoding='utf-8')
          (crate / 'src/lib.rs').write_text('// lockfile bootstrap only\n', encoding='utf-8')
          PY
          cargo generate-lockfile
          cargo update --workspace --locked --dry-run
          echo 'M5_LOCK_GZIP_BASE64_BEGIN'
          gzip -n -c Cargo.lock | base64 -w0
          echo
          echo 'M5_LOCK_GZIP_BASE64_END'
