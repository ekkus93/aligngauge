name: Milestone 9 core targeted validation 4

on:
  push:
    branches:
      - milestone-9-targeted-metrics
    paths:
      - .github/workflows/m9-core-targeted-build4.yml
      - .github/m9-core-targeted.py
      - .github/m9-core-refactor.py
      - .github/m9-core-borrow-fix.py
      - .github/m9-core-lint-fix.py

concurrency:
  group: milestone-9-core-targeted-4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: m9/core-targeted-4
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Apply guarded integration edits
        run: python .github/m9-core-targeted.py
      - name: Refactor generated finalizers
        run: python .github/m9-core-refactor.py
      - name: Fix finalizer ownership order
        run: python .github/m9-core-borrow-fix.py
      - name: Refactor remaining lint shapes
        run: python .github/m9-core-lint-fix.py
      - name: Refresh lockfile
        run: cargo update --workspace
      - name: Apply scoped Clippy fixes
        run: cargo clippy -p aligngauge-core -p aligngauge-coverage --all-targets --all-features --fix --allow-dirty --allow-staged
      - name: Format workspace
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --all-features
      - name: Verify generated diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          allowed='^(Cargo.lock|crates/aligngauge-core/src/lib.rs|crates/aligngauge-core/src/model.rs|crates/aligngauge-core/src/targeted.rs|crates/aligngauge-core/tests/contracts.rs|crates/aligngauge-core/tests/golden/summary.json|crates/aligngauge-coverage/Cargo.toml|crates/aligngauge-coverage/src/lib.rs|crates/aligngauge-coverage/src/plan.rs|crates/aligngauge-coverage/src/util.rs|crates/aligngauge-coverage/src/targeted.rs|crates/aligngauge-coverage/src/accumulator/mod.rs|crates/aligngauge-coverage/src/accumulator/events.rs|crates/aligngauge-coverage/src/accumulator/reduce.rs|crates/aligngauge-coverage/src/report.rs|crates/aligngauge-coverage/src/tests.rs|crates/aligngauge-coverage/tests/targeted_contract.rs|schemas/summary.schema.json)$'
          while read -r path; do
            [[ -z "${path}" ]] && continue
            [[ "${path}" =~ ${allowed} ]] || { echo "unexpected generated path: ${path}" >&2; exit 1; }
          done < <(git status --short | awk '{print $2}' | sort)
      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock \
            crates/aligngauge-core/src/lib.rs \
            crates/aligngauge-core/src/model.rs \
            crates/aligngauge-core/src/targeted.rs \
            crates/aligngauge-core/tests/contracts.rs \
            crates/aligngauge-core/tests/golden/summary.json \
            crates/aligngauge-coverage/Cargo.toml \
            crates/aligngauge-coverage/src/lib.rs \
            crates/aligngauge-coverage/src/plan.rs \
            crates/aligngauge-coverage/src/util.rs \
            crates/aligngauge-coverage/src/targeted.rs \
            crates/aligngauge-coverage/src/accumulator/mod.rs \
            crates/aligngauge-coverage/src/accumulator/events.rs \
            crates/aligngauge-coverage/src/accumulator/reduce.rs \
            crates/aligngauge-coverage/src/report.rs \
            crates/aligngauge-coverage/src/tests.rs \
            crates/aligngauge-coverage/tests/targeted_contract.rs \
            schemas/summary.schema.json
          git commit -m 'feat: add exact Milestone 9 targeted coverage reducer'
          git push origin HEAD:milestone-9-targeted-metrics
