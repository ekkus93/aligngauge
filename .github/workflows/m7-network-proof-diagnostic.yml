name: M7 network proof diagnostic

on:
  push:
    branches: [milestone-7-cram]
    paths:
      - .github/workflows/m7-network-proof-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install syscall tracer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace

      - name: Capture exact network-isolation invocation
        shell: bash
        run: |
          set -u
          cargo test -p aligngauge-cli --test cram_v0_2 --no-run --locked > build.stdout 2> build.stderr
          build_rc=$?
          test_bin="$(find target/debug/deps -maxdepth 1 -type f -executable -name 'cram_v0_2-*' -print -quit)"
          printf 'build_rc=%s\ntest_bin=%s\n' "$build_rc" "$test_bin" > diagnostic.meta
          : > network.trace
          : > test.stdout
          : > test.stderr
          if [[ "$build_rc" -eq 0 && -n "$test_bin" ]]; then
            sudo unshare --net /usr/bin/strace -f -qq -e trace=network -o "$PWD/network.trace" \
              "$PWD/$test_bin" --exact hostile_reference_environment_cannot_replace_explicit_local_policy \
              > test.stdout 2> test.stderr
            test_rc=$?
          else
            test_rc=125
          fi
          printf 'test_rc=%s\n' "$test_rc" >> diagnostic.meta
          grep -E 'AF_INET|AF_INET6' network.trace > network.matches || true
          echo '=== meta ==='
          cat diagnostic.meta
          echo '=== test stdout ==='
          cat test.stdout
          echo '=== test stderr ==='
          cat test.stderr
          echo '=== network matches ==='
          cat network.matches
          exit 0

      - name: Upload exact diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m7-network-proof-${{ github.sha }}
          path: |
            diagnostic.meta
            build.stdout
            build.stderr
            test.stdout
            test.stderr
            network.trace
            network.matches
          if-no-files-found: error
          retention-days: 1
