name: One-time v0.4.0 release publisher

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-time-v0.4.0-release.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: release/v0.4.0
    if: github.repository == 'ekkus93/aligngauge'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: 5be4aa4e5df3e8feb17fdde46c408683ac08bb53
      TAG_NAME: v0.4.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prove publisher is immediately after validated target
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          commit="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/commits/${GITHUB_SHA}")"
          parent="$(jq -r '.parents[0].sha // empty' <<<"${commit}")"
          if [[ "${parent}" != "${TARGET_SHA}" ]]; then
            echo "Refusing to publish: publisher parent is ${parent:-<missing>}, expected ${TARGET_SHA}." >&2
            exit 1
          fi

      - name: Revalidate exact release SHA
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          runs="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/runs?head_sha=${TARGET_SHA}&per_page=100")"

          required=(
            "Permanent CI:31255804251"
            "Reference Validation:31255804281"
            "V0.4 Release Validation:31255804250"
          )

          for requirement in "${required[@]}"; do
            workflow="${requirement%%:*}"
            run_id="${requirement##*:}"
            count="$(jq --arg workflow "${workflow}" --arg sha "${TARGET_SHA}" --argjson run_id "${run_id}" \
              '[.workflow_runs[] | select(.id == $run_id and .name == $workflow and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | length' \
              <<<"${runs}")"
            if [[ "${count}" -ne 1 ]]; then
              echo "Required exact-SHA workflow is not successful: ${workflow} run ${run_id}" >&2
              exit 1
            fi
          done

      - name: Refuse an existing tag or release
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"

          tag_status="$(curl --silent --show-error --output /tmp/tag.json --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/ref/tags/${TAG_NAME}")"
          if [[ "${tag_status}" != "404" ]]; then
            echo "Refusing to publish: tag ${TAG_NAME} already exists (HTTP ${tag_status})." >&2
            cat /tmp/tag.json >&2
            exit 1
          fi

          release_status="$(curl --silent --show-error --output /tmp/release.json --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/releases/tags/${TAG_NAME}")"
          if [[ "${release_status}" != "404" ]]; then
            echo "Refusing to publish: release ${TAG_NAME} already exists (HTTP ${release_status})." >&2
            cat /tmp/release.json >&2
            exit 1
          fi

      - name: Create v0.4.0 release at validated SHA
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          body="$(cat <<'EOF'
          AlignGauge v0.4.0 is the ecosystem-compatibility release built on the validated v0.3 targeted-analysis foundation.

          Release SHA: `5be4aa4e5df3e8feb17fdde46c408683ac08bb53`
          PR #8 merge SHA: `c1ded07bad71b330aa712d65ec38850de009a218`

          Exact release-SHA validation:
          - Permanent CI: run `31255804251`, job `93098870269`
          - Reference Validation: run `31255804281`, job `93098876451`
          - V0.4 Release Validation: run `31255804250`, job `93098876838`

          The PR #8 merge was also validated on master by the complete ten-workflow matrix: Permanent CI, Full Runtime, Reference, Targeted, Samtools Stats, Picard, MultiQC, Exact Overlap, V0.4 Release Validation, and HG002 Preparation.

          v0.4 releases these exact compatibility profiles:
          - `samtools-stats-1.24-multiqc-1.35`
          - `picard-alignment-summary-3.4.0-all-reads-subset-v1`
          - `picard-insert-size-3.4.0-all-reads-v1`

          Pinned MultiQC 1.35 independently parses generated Samtools Stats and Picard InsertSize outputs and requires byte-identical parsed data versus the corresponding pinned reference output. The 13-field Picard AlignmentSummary subset remains a direct Picard 3.4.0 compatibility claim, not a MultiQC claim, because the pinned parser requires reference-dependent columns outside that released subset.

          The release gate also proves byte-identical canonical summaries between serial decoding and `--io-threads 2` for both ordinary and targeted release paths. Collector execution remains deterministic and serial; `--threads >1` continues to report `collector_threads_serial_v0_1` rather than implying an unimplemented parallel collector.

          Picard WgsMetrics and HsMetrics remain explicitly deferred. Milestone 13 proves their exact overlap primitives against pinned Picard 3.4.0 / HTSJDK 4.2.0, but v0.4 does not expose incomplete WGS/Hs formats. Native `target_uniformity_penalty_80` remains distinct from Picard `FOLD_80_BASE_PENALTY`. Indexed reference-partition execution also remains unsupported.

          Detailed evidence is committed in `docs/evidence/V0_4_COMPATIBILITY_REPORT.md` and `docs/evidence/V0_4_RELEASE_VALIDATION.md` in the tagged tree.
          EOF
          )"

          payload="$(jq -n \
            --arg tag "${TAG_NAME}" \
            --arg target "${TARGET_SHA}" \
            --arg name "AlignGauge v0.4.0" \
            --arg body "${body}" \
            '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false,generate_release_notes:false}')"

          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/releases" \
            -d "${payload}" \
            > /tmp/created-release.json

          jq '{id,tag_name,target_commitish,name,draft,prerelease,html_url}' /tmp/created-release.json

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          ref="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/ref/tags/${TAG_NAME}")"
          actual="$(jq -r '.object.sha' <<<"${ref}")"
          if [[ "${actual}" != "${TARGET_SHA}" ]]; then
            echo "Release tag points to ${actual}, expected ${TARGET_SHA}." >&2
            exit 1
          fi

          release="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/releases/tags/${TAG_NAME}")"
          release_target="$(jq -r '.target_commitish' <<<"${release}")"
          if [[ "${release_target}" != "${TARGET_SHA}" ]]; then
            echo "Release target_commitish is ${release_target}, expected ${TARGET_SHA}." >&2
            exit 1
          fi
          echo "${TAG_NAME} -> ${actual}"
