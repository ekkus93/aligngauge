name: One-time v0.5 safe reader FFI patch

on:
  push:
    branches: [agent/v0.5-production-beta]
    paths:
      - ".github/workflows/one-time-v0.5-reader-ffi-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    name: maintenance/v0.5-reader-ffi-patch
    if: github.repository == 'ekkus93/aligngauge'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_PARENT: e6ef68896dfc31aae970530535a7fcd4536772cb
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/v0.5-production-beta
          fetch-depth: 2
          persist-credentials: true

      - name: Prove helper is immediately after expected parent
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT" ]]
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply exact safe call-site patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/aligngauge-hts/src/reader.rs')
          text = path.read_text(encoding='utf-8')
          old = '''fn open_htslib_reader(
              input: &Path,
              options: ReaderOptions,
              format: AlignmentFormat,
          ) -> Result<Reader, AlignGaugeError> {
              let mut reader = Reader::from_path(input).map_err(|source| {
          '''.replace('          ', '')
          new = '''fn open_htslib_reader(
              input: &Path,
              options: ReaderOptions,
              format: AlignmentFormat,
          ) -> Result<Reader, AlignGaugeError> {
              aligngauge_hts_ffi::preflight_header(input).map_err(|source| {
                  AlignGaugeError::new(
                      ErrorCategory::InputCorrupt,
                      format!(
                          "failed HTSlib header ownership preflight for {} input '{}'",
                          format.as_str(),
                          input.display()
                      ),
                  )
                  .with_detail("input", input.to_string_lossy().into_owned())
                  .with_source(source)
              })?;
              let mut reader = Reader::from_path(input).map_err(|source| {
          '''.replace('          ', '')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one reader call-site match, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check

      - name: Validate workspace before commit
        run: |
          cargo test -p aligngauge-hts --locked
          cargo clippy -p aligngauge-hts-ffi -p aligngauge-hts --all-targets --locked -- -D warnings

      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-v0.5-reader-ffi-patch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/aligngauge-hts/src/reader.rs \
            .github/workflows/one-time-v0.5-reader-ffi-patch.yml
          git commit -m 'fix: preflight HTS headers through owned FFI shim'
          git push origin HEAD:agent/v0.5-production-beta
