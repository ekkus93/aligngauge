name: M10 semantic freeze

on:
  push:
    branches:
      - milestone-10-samtools-stats
    paths:
      - .github/m10-semantic-freeze.py
      - .github/workflows/m10-semantic-freeze.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply semantic freeze
        run: |
          set -euo pipefail
          python .github/m10-semantic-freeze.py
          git diff --check
          test -f docs/adr/ADR-0007-SAMTOOLS_STATS_MULTIQC_PROFILE.md
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' docs/DNA_QC_ENGINE_SPEC.md docs/DNA_QC_ENGINE_TODO.md | sort)"
          [[ "$changed" == "$expected" ]] || { git status --short; exit 1; }
      - name: Commit semantic freeze and remove bootstrap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DNA_QC_ENGINE_SPEC.md docs/DNA_QC_ENGINE_TODO.md
          git rm .github/m10-semantic-freeze.py .github/workflows/m10-semantic-freeze.yml
          git commit -m 'docs: freeze Milestone 10 compatibility semantics'
          git push origin HEAD:milestone-10-samtools-stats
