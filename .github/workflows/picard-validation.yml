name: Picard Validation

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/picard-validation.yml"
      - "crates/aligngauge-cli/**"
      - "crates/aligngauge-core/**"
      - "crates/aligngauge-hts/**"
      - "crates/aligngauge-metrics/**"
      - "crates/aligngauge-testkit/**"
      - "testdata/fixtures/**"
      - "testdata/hg002/**"
      - "testdata/manifest.v1.tsv"
      - "tools/reference/picard/**"
      - "docs/DNA_QC_ENGINE_SPEC.md"
      - "docs/DNA_QC_ENGINE_TODO.md"
      - "docs/adr/ADR-0008-PICARD_ALIGNMENT_INSERT_SIZE_PROFILE.md"
      - "docs/evidence/M11_PICARD_ALIGNMENT_INSERT_SIZE.md"
  pull_request:
    paths:
      - ".github/workflows/picard-validation.yml"
      - "crates/aligngauge-cli/**"
      - "crates/aligngauge-core/**"
      - "crates/aligngauge-hts/**"
      - "crates/aligngauge-metrics/**"
      - "crates/aligngauge-testkit/**"
      - "testdata/fixtures/**"
      - "testdata/hg002/**"
      - "testdata/manifest.v1.tsv"
      - "tools/reference/picard/**"
      - "docs/DNA_QC_ENGINE_SPEC.md"
      - "docs/DNA_QC_ENGINE_TODO.md"
      - "docs/adr/ADR-0008-PICARD_ALIGNMENT_INSERT_SIZE_PROFILE.md"
      - "docs/evidence/M11_PICARD_ALIGNMENT_INSERT_SIZE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ci/picard
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate Picard reference lock and tools
        shell: bash
        run: |
          set -euo pipefail
          source tools/reference/picard/image.lock
          [[ "$version" == "3.4.0" ]]
          [[ "$image" == "broadinstitute/picard@sha256:f11df229b5b49ea28a872c04fc5d33e76bd14890754079390f36897c16194b28" ]]
          [[ "$jar" == "/usr/picard/picard.jar" ]]
          bash -n tools/reference/picard/run-alignment-summary.sh
          bash -n tools/reference/picard/run-insert-size.sh
          python3 -m py_compile tools/reference/picard/compare-alignment-summary.py
          python3 -m py_compile tools/reference/picard/compare-insert-size.py

      - name: Verify deterministic Picard fixture identities
        shell: bash
        run: |
          set -euo pipefail
          grep -F $'picard_alignment_edge\tvalid\t398\t6bb7bc2f0516c0c94bd460d3f9ca501ba4c2c622740981976c5fc7b9839ace8b\t104\tde8af8d39d94c9314030eca8a611f9b219877188227e6e70a1eff133c50b82da' testdata/manifest.v1.tsv
          grep -F $'picard_insert_edge\tvalid\t526\tb8d61a55b4dd391163332b8195984821d7f303509b8d16996c73ab94a91d0f47\t104\t02bc65429d491c3b8e45f84f6b170578449aec24aad50651df905382204becff' testdata/manifest.v1.tsv

      - name: Build AlignGauge Picard compatibility probes
        run: cargo build --release -p aligngauge-cli --locked

      - name: Compare synthetic Picard alignment-summary subset exactly
        shell: bash
        run: |
          set -euo pipefail
          for id in basic flags_and_pairs empty picard_alignment_edge; do
            root="target/m11/$id/alignment"
            mkdir -p "$root/reference"
            bash tools/reference/picard/run-alignment-summary.sh \
              "testdata/fixtures/$id.bam" \
              "$root/reference"
            target/release/aligngauge qc \
              --input "testdata/fixtures/$id.bam" \
              --format picard-alignment-summary \
              > "$root/aligngauge.txt"
            python3 tools/reference/picard/compare-alignment-summary.py \
              "$root/reference/metrics.txt" \
              "$root/aligngauge.txt" \
              "$root/differential.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('target/m11').glob('*/alignment/differential.json')):
              report = json.loads(path.read_text())
              assert report['status'] == 'exact', path
              assert report['tolerance'] is None, path
              assert report['compatibility_profile'] == 'picard-alignment-summary-3.4.0-all-reads-subset-v1', path
          PY

      - name: Compare synthetic Picard insert-size profile exactly
        shell: bash
        run: |
          set -euo pipefail
          for id in basic flags_and_pairs empty picard_insert_edge; do
            root="target/m11/$id/insert"
            mkdir -p "$root/reference"
            bash tools/reference/picard/run-insert-size.sh \
              "testdata/fixtures/$id.bam" \
              "$root/reference"
            target/release/aligngauge qc \
              --input "testdata/fixtures/$id.bam" \
              --format picard-insert-size \
              > "$root/aligngauge.txt"
            python3 tools/reference/picard/compare-insert-size.py \
              "$root/reference/metrics.txt" \
              "$root/aligngauge.txt" \
              "$root/differential.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('target/m11').glob('*/insert/differential.json')):
              report = json.loads(path.read_text())
              assert report['status'] == 'exact', path
              assert report['tolerance'] is None, path
              assert report['compatibility_profile'] == 'picard-insert-size-3.4.0-all-reads-v1', path
          edge = json.loads(Path('target/m11/picard_insert_edge/insert/differential.json').read_text())
          assert edge['metric_rows'] == 1
          PY

      - name: Prepare deterministic HG002 subset
        run: testdata/hg002/prepare.sh "$GITHUB_WORKSPACE/target/m11/hg002"

      - name: Compare HG002 Picard alignment-summary subset exactly
        shell: bash
        run: |
          set -euo pipefail
          root=target/m11/hg002/alignment
          mkdir -p "$root/reference"
          bash tools/reference/picard/run-alignment-summary.sh \
            target/m11/hg002/subset.bam \
            "$root/reference"
          target/release/aligngauge qc \
            --input target/m11/hg002/subset.bam \
            --format picard-alignment-summary \
            > "$root/aligngauge.txt"
          python3 tools/reference/picard/compare-alignment-summary.py \
            "$root/reference/metrics.txt" \
            "$root/aligngauge.txt" \
            "$root/differential.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('target/m11/hg002/alignment/differential.json').read_text())
          assert report['status'] == 'exact'
          assert report['tolerance'] is None
          PY

      - name: Compare HG002 Picard insert-size profile exactly
        shell: bash
        run: |
          set -euo pipefail
          root=target/m11/hg002/insert
          mkdir -p "$root/reference"
          bash tools/reference/picard/run-insert-size.sh \
            target/m11/hg002/subset.bam \
            "$root/reference"
          target/release/aligngauge qc \
            --input target/m11/hg002/subset.bam \
            --format picard-insert-size \
            > "$root/aligngauge.txt"
          python3 tools/reference/picard/compare-insert-size.py \
            "$root/reference/metrics.txt" \
            "$root/aligngauge.txt" \
            "$root/differential.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('target/m11/hg002/insert/differential.json').read_text())
          assert report['status'] == 'exact'
          assert report['tolerance'] is None
          PY

      - name: Prove unsupported alignment-summary columns stay absent
        shell: bash
        run: |
          set -euo pipefail
          header="$(grep -m1 '^CATEGORY' target/m11/hg002/alignment/aligngauge.txt)"
          expected=$'CATEGORY\tTOTAL_READS\tPF_READS\tPCT_PF_READS\tPF_NOISE_READS\tPCT_ADAPTER\tMEAN_READ_LENGTH\tSD_READ_LENGTH\tMEDIAN_READ_LENGTH\tMAD_READ_LENGTH\tMIN_READ_LENGTH\tMAX_READ_LENGTH\tBAD_CYCLES'
          [[ "$header" == "$expected" ]]
          if grep -Eq 'PF_READS_ALIGNED|PF_MISMATCH_RATE|PF_INDEL_RATE|PCT_CHIMERAS|STRAND_BALANCE|PCT_SOFTCLIP|PCT_HARDCLIP' \
            target/m11/hg002/alignment/aligngauge.txt; then
            echo 'AlignGauge emitted a reference-dependent field outside the M11 compatibility claim' >&2
            exit 1
          fi

      - name: Upload M11 validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: picard-validation-${{ github.sha }}
          path: |
            target/m11/basic/alignment/reference/metrics.txt
            target/m11/basic/alignment/reference/image.txt
            target/m11/basic/alignment/aligngauge.txt
            target/m11/basic/alignment/differential.json
            target/m11/flags_and_pairs/insert/reference/metrics.txt
            target/m11/flags_and_pairs/insert/reference/output_state.txt
            target/m11/flags_and_pairs/insert/aligngauge.txt
            target/m11/flags_and_pairs/insert/differential.json
            target/m11/picard_alignment_edge/alignment/reference/metrics.txt
            target/m11/picard_alignment_edge/alignment/aligngauge.txt
            target/m11/picard_alignment_edge/alignment/differential.json
            target/m11/picard_insert_edge/insert/reference/metrics.txt
            target/m11/picard_insert_edge/insert/reference/output_state.txt
            target/m11/picard_insert_edge/insert/aligngauge.txt
            target/m11/picard_insert_edge/insert/differential.json
            target/m11/hg002/prepared.manifest
            target/m11/hg002/alignment/reference/metrics.txt
            target/m11/hg002/alignment/reference/image.txt
            target/m11/hg002/alignment/aligngauge.txt
            target/m11/hg002/alignment/differential.json
            target/m11/hg002/insert/reference/metrics.txt
            target/m11/hg002/insert/reference/output_state.txt
            target/m11/hg002/insert/aligngauge.txt
            target/m11/hg002/insert/differential.json
          if-no-files-found: error
          retention-days: 7
