name: Milestone 8 formats validation

on:
  push:
    branches: [milestone-8-bed-normalization]
    paths:
      - .github/workflows/m8-formats-build.yml
      - Cargo.toml
      - Cargo.lock
      - crates/aligngauge-formats/**
      - docs/adr/ADR-0005-BED_UNKNOWN_CONTIG_POLICY.md

permissions:
  contents: write

jobs:
  validate:
    name: m8/formats
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Show pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Apply exact lint corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "crates/aligngauge-formats/src/lib.rs",
              "//! Validated text formats and deterministic target normalization for AlignGauge.",
              "//! Validated text formats and deterministic target normalization for `AlignGauge`.",
          )
          replace_once(
              "crates/aligngauge-formats/src/bed.rs",
              '''        if let Some(last) = merged.last_mut() {
              if last.contig_index == interval.contig_index && interval.start <= last.end {
                  if interval.start == last.end {
                      bump(&mut adjacency_merges)?;
                  } else {
                      bump(&mut overlap_merges)?;
                  }
                  last.end = last.end.max(interval.end);
                  last.source_interval_indices.push(interval.source_index);
                  continue;
              }
          }''',
              '''        if let Some(last) = merged.last_mut()
              && last.contig_index == interval.contig_index
              && interval.start <= last.end
          {
              if interval.start == last.end {
                  bump(&mut adjacency_merges)?;
              } else {
                  bump(&mut overlap_merges)?;
              }
              last.end = last.end.max(interval.end);
              last.source_interval_indices.push(interval.source_index);
              continue;
          }''',
          )
          PY

      - name: Refresh lockfile and formatting
        run: |
          cargo update --workspace
          cargo fmt --all

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-features

      - name: Verify generated diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          allowed="$(printf '%s\n' Cargo.lock crates/aligngauge-formats/src/bed.rs crates/aligngauge-formats/src/lib.rs | sort)"
          if [[ -n "${changed}" && "${changed}" != "${allowed}" && "${changed}" != "Cargo.lock" && "${changed}" != "crates/aligngauge-formats/src/bed.rs" && "${changed}" != "crates/aligngauge-formats/src/lib.rs" ]]; then
            echo 'unexpected generated changes:' >&2
            git status --short >&2
            exit 1
          fi

      - name: Commit validated generated changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/aligngauge-formats/src/bed.rs crates/aligngauge-formats/src/lib.rs
          git commit -m 'build: validate Milestone 8 formats slice'
          git push origin HEAD:milestone-8-bed-normalization
