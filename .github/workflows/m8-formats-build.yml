name: Milestone 8 formats validation

on:
  push:
    branches:
      - milestone-8-bed-normalization
    paths:
      - .github/workflows/m8-formats-build.yml
      - .github/m8-harden-bed.py
      - Cargo.toml
      - Cargo.lock
      - crates/aligngauge-formats/**
      - docs/adr/ADR-0005-BED_UNKNOWN_CONTIG_POLICY.md

concurrency:
  group: milestone-8-formats-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: m8/formats
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Show pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Apply idempotent BED hardening
        run: python .github/m8-harden-bed.py

      - name: Refresh lockfile
        run: cargo update --workspace

      - name: Apply scoped Clippy fixes
        run: cargo clippy -p aligngauge-formats --all-targets --all-features --fix --allow-dirty --allow-staged

      - name: Format workspace
        run: cargo fmt --all

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-features

      - name: Verify generated diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          allowed="$(printf '%s\n' Cargo.lock crates/aligngauge-formats/src/bed.rs crates/aligngauge-formats/src/lib.rs crates/aligngauge-formats/tests/bed_contract.rs | sort)"
          if [[ -n "${changed}" && "${changed}" != "${allowed}" && "${changed}" != "Cargo.lock" && "${changed}" != "crates/aligngauge-formats/src/bed.rs" && "${changed}" != "crates/aligngauge-formats/src/lib.rs" && "${changed}" != "crates/aligngauge-formats/tests/bed_contract.rs" ]]; then
            echo 'unexpected generated changes:' >&2
            git status --short >&2
            exit 1
          fi

      - name: Commit validated generated changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/aligngauge-formats/src/bed.rs crates/aligngauge-formats/src/lib.rs crates/aligngauge-formats/tests/bed_contract.rs
          git commit -m 'feat: harden Milestone 8 BED field parsing'
          git push origin HEAD:milestone-8-bed-normalization
