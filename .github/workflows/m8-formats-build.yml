name: Milestone 8 formats validation

on:
  push:
    branches: [milestone-8-bed-normalization]
    paths:
      - .github/workflows/m8-formats-build.yml
      - Cargo.toml
      - Cargo.lock
      - crates/aligngauge-formats/**
      - docs/adr/ADR-0005-BED_UNKNOWN_CONTIG_POLICY.md

permissions:
  contents: write

jobs:
  validate:
    name: m8/formats
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Show pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Correct merge-event tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("crates/aligngauge-formats/src/bed.rs")
          text = path.read_text()

          pattern = re.compile(
              r"assert_eq!\(targets\.normalization\.overlap_merges, 1\);\s*"
              r"assert_eq!\(targets\.normalization\.adjacency_merges, 1\);"
          )
          replacement = (
              "assert_eq!(targets.normalization.overlap_merges, 2);\n"
              "        assert_eq!(targets.normalization.adjacency_merges, 0);"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one mixed-merge expectation block, found {count}")

          marker = "    #[test]\n    fn configurable_flanks_clip_only_at_authoritative_boundaries() {"
          adjacency_test = '''    #[test]
          fn directly_adjacent_intervals_merge_as_adjacency() {
              let parsed = parse_bed_bytes(
                  b"chr1\\t10\\t20\\tA\\nchr1\\t20\\t30\\tB\\n",
                  &dictionary(),
              )
              .expect("BED should parse");
              let targets = normalize_targets(parsed, TargetNormalizationConfig::default())
                  .expect("normalization should succeed");
              assert_eq!(targets.merged_intervals.len(), 1);
              assert_eq!(targets.merged_intervals[0].start, 10);
              assert_eq!(targets.merged_intervals[0].end, 30);
              assert_eq!(targets.merged_intervals[0].source_interval_indices, [0, 1]);
              assert_eq!(targets.normalization.overlap_merges, 0);
              assert_eq!(targets.normalization.adjacency_merges, 1);
          }

          #[test]
          fn configurable_flanks_clip_only_at_authoritative_boundaries() {'''
          if text.count(marker) != 1:
              raise SystemExit("expected exactly one configurable-flank test marker")
          path.write_text(text.replace(marker, adjacency_test, 1))
          PY

      - name: Refresh lockfile
        run: cargo update --workspace

      - name: Apply scoped Clippy fixes
        run: cargo clippy -p aligngauge-formats --all-targets --all-features --fix --allow-dirty --allow-staged

      - name: Format workspace
        run: cargo fmt --all

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-features

      - name: Verify generated diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          allowed="$(printf '%s\n' Cargo.lock crates/aligngauge-formats/src/bed.rs crates/aligngauge-formats/src/lib.rs | sort)"
          if [[ -n "${changed}" && "${changed}" != "${allowed}" && "${changed}" != "Cargo.lock" && "${changed}" != "crates/aligngauge-formats/src/bed.rs" && "${changed}" != "crates/aligngauge-formats/src/lib.rs" ]]; then
            echo 'unexpected generated changes:' >&2
            git status --short >&2
            exit 1
          fi

      - name: Commit validated generated changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/aligngauge-formats/src/bed.rs crates/aligngauge-formats/src/lib.rs
          git commit -m 'build: validate Milestone 8 formats slice'
          git push origin HEAD:milestone-8-bed-normalization
