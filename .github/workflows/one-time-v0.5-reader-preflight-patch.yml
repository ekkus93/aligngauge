name: One-time v0.5 reader preflight patch

on:
  push:
    branches: [agent/v0.5-production-beta]
    paths:
      - ".github/workflows/one-time-v0.5-reader-preflight-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    name: maintenance/v0.5-reader-preflight-patch
    if: github.repository == 'ekkus93/aligngauge'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_PARENT: 65941151920861000c8ab87e85d1d876c1a29179
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/v0.5-production-beta
          fetch-depth: 2
          persist-credentials: true

      - name: Prove helper is immediately after expected parent
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD^)" == "$EXPECTED_PARENT" ]]
          [[ "$(git branch --show-current)" == "agent/v0.5-production-beta" ]]
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply exact reader call-site patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/aligngauge-hts/src/reader.rs')
          text = path.read_text(encoding='utf-8')
          old = '''fn open_htslib_reader(
              input: &Path,
              options: ReaderOptions,
              format: AlignmentFormat,
          ) -> Result<Reader, AlignGaugeError> {
              let mut reader = Reader::from_path(input).map_err(|source| {
          '''.replace('          ', '')
          new = '''fn open_htslib_reader(
              input: &Path,
              options: ReaderOptions,
              format: AlignmentFormat,
          ) -> Result<Reader, AlignGaugeError> {
              crate::raw_header_preflight::preflight_header_open(input, format.as_str())?;
              let mut reader = Reader::from_path(input).map_err(|source| {
          '''.replace('          ', '')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one open_htslib_reader call-site match, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check
          git diff -- crates/aligngauge-hts/src/reader.rs

      - name: Validate HTS reader before commit
        run: cargo test -p aligngauge-hts --locked

      - name: Commit patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-v0.5-reader-preflight-patch.yml
          git diff --check
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          grep -F 'crates/aligngauge-hts/src/reader.rs' <<<"$changed" >/dev/null
          grep -F '.github/workflows/one-time-v0.5-reader-preflight-patch.yml' <<<"$changed" >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/aligngauge-hts/src/reader.rs \
            .github/workflows/one-time-v0.5-reader-preflight-patch.yml
          git commit -m 'fix: preflight HTS headers with owned cleanup'
          git push origin HEAD:agent/v0.5-production-beta
