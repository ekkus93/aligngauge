name: One-time Milestone 8 final closer

on:
  push:
    branches:
      - milestone-8-bed-normalization
    paths:
      - .github/workflows/m8-final-close.yml

permissions:
  contents: write

jobs:
  close:
    name: docs/m8-final-close
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Close Milestone 8 evidence and TODO
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'docs/DNA_QC_ENGINE_TODO.md',
              '**Status:** Ralph Loop active — `v0.2.0` released; Milestone 8 implementation/evidence complete; exact-SHA acceptance gate pending',
              '**Status:** Ralph Loop active — `v0.2.0` released; Milestone 8 complete; Milestone 9 next',
          )
          replace_once(
              'docs/DNA_QC_ENGINE_TODO.md',
              '**Status:** Implementation and evidence complete — validated implementation source SHA `8bc7f6df8154f2f3162e8d498781873364b4c1ea`; branch validation run `31197147271`, job `92928071302`, success; evidence in `docs/evidence/M8_BED_NORMALIZATION.md`. Final completion remains pending Permanent CI on the exact evidence/TODO candidate.',
              '**Status:** Complete — validated implementation source SHA `8bc7f6df8154f2f3162e8d498781873364b4c1ea`; exact evidence/TODO acceptance SHA `b4ccbe30e37b1ece1bb34fca89b594a8aa195ed6`; branch validation run `31197147271`, job `92928071302`; Permanent CI run `31197752424`, job `92930131540`; Full Runtime Validation run `31197752286`, job `92930136219`; Reference Validation run `31197752293`, job `92930129164`; all successful. Evidence: `docs/evidence/M8_BED_NORMALIZATION.md`.',
          )
          replace_once(
              'docs/DNA_QC_ENGINE_TODO.md',
              '- [ ] Permanent CI succeeds on the exact evidence/TODO candidate commit.',
              '- [x] Permanent CI succeeds on the exact evidence/TODO candidate commit.',
          )

          replace_once(
              'docs/evidence/M8_BED_NORMALIZATION.md',
              '**Pre-evidence PR head:** `5441775343f6a84b25490c997be32270e351745d`  \n**Disposition:** Implementation and required Milestone 8 tests are complete. The milestone acceptance gate remains open until Permanent CI succeeds on the exact evidence/TODO candidate commit.',
              '**Pre-evidence PR head:** `5441775343f6a84b25490c997be32270e351745d`  \n**Exact evidence/TODO acceptance SHA:** `b4ccbe30e37b1ece1bb34fca89b594a8aa195ed6`  \n**Disposition:** Complete — Milestone 8 implementation, evidence, and exact-SHA acceptance gates have passed.',
          )
          replace_once(
              'docs/evidence/M8_BED_NORMALIZATION.md',
              'PR #2 then began the repository\'s standing Permanent CI, Full Runtime Validation, and Reference Validation workflows on pre-evidence head `5441775343f6a84b25490c997be32270e351745d`.',
              '''PR #2 then ran the repository's standing gates on the permanent evidence/TODO acceptance candidate `b4ccbe30e37b1ece1bb34fca89b594a8aa195ed6`:

          | Gate | Run | Job | Result |
          | --- | --- | --- | --- |
          | Permanent CI | `31197752424` | `92930131540` | success |
          | Full Runtime Validation | `31197752286` | `92930136219` | success |
          | Reference Validation | `31197752293` | `92930129164` | success |

          Permanent CI on the exact acceptance SHA passed formatting, dependency and schema validation, strict Clippy, the complete workspace test suite, the CRAM network-isolation proof, documentation, and clean-tree verification.''',
          )
          replace_once(
              'docs/evidence/M8_BED_NORMALIZATION.md',
              'Implementation tasks 8.1 and 8.2 are complete and have direct tests/evidence. Milestone 8 is not yet declared complete by this document because the repository\'s milestone rule still requires Permanent CI success on the exact evidence/TODO candidate commit.',
              'Implementation tasks 8.1 and 8.2 are complete and have direct tests/evidence. Permanent CI succeeded on exact evidence/TODO acceptance SHA `b4ccbe30e37b1ece1bb34fca89b594a8aa195ed6`, with Full Runtime and Reference Validation also successful on that same SHA. Milestone 8 is therefore complete; Milestone 9 may consume this normalized target model without redefining its parser or territory semantics.',
          )
          PY

          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' docs/DNA_QC_ENGINE_TODO.md docs/evidence/M8_BED_NORMALIZATION.md | sort)"
          if [[ "${changed}" != "${expected}" ]]; then
            echo 'unexpected Milestone 8 closure changes:' >&2
            git status --short >&2
            exit 1
          fi

      - name: Commit Milestone 8 closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DNA_QC_ENGINE_TODO.md docs/evidence/M8_BED_NORMALIZATION.md
          git commit -m 'docs: close Milestone 8 acceptance'
          git push origin HEAD:milestone-8-bed-normalization
