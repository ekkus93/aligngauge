name: M11 Picard Oracle
# include deterministic M11 edge fixtures

on:
  push:
    branches:
      - milestone-11-picard-profiles
    paths:
      - .github/workflows/m11-picard-oracle.yml

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate reference scripts
        run: |
          set -euo pipefail
          bash -n tools/reference/picard/run-alignment-summary.sh
          bash -n tools/reference/picard/run-insert-size.sh
          python3 -m py_compile tools/reference/picard/compare-alignment-summary.py
          python3 -m py_compile tools/reference/picard/compare-insert-size.py
      - name: Build AlignGauge compatibility probes
        run: cargo build --release -p aligngauge-cli --locked
      - name: Run exact Picard alignment-summary oracle
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/m11-oracle"
          mkdir -p "$root"
          for id in basic flags_and_pairs empty picard_alignment_edge; do
            input="testdata/fixtures/$id.bam"
            mkdir -p "$root/$id/alignment"
            bash tools/reference/picard/run-alignment-summary.sh "$input" "$root/$id/alignment/reference"
            target/release/aligngauge qc --input "$input" --format picard-alignment-summary \
              > "$root/$id/alignment/aligngauge.txt"
            python3 tools/reference/picard/compare-alignment-summary.py \
              "$root/$id/alignment/reference/metrics.txt" \
              "$root/$id/alignment/aligngauge.txt" \
              "$root/$id/alignment/differential.json"
          done
      - name: Run exact Picard insert-size oracle
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/m11-oracle"
          for id in basic flags_and_pairs empty picard_insert_edge; do
            input="testdata/fixtures/$id.bam"
            mkdir -p "$root/$id/insert"
            bash tools/reference/picard/run-insert-size.sh "$input" "$root/$id/insert/reference"
            target/release/aligngauge qc --input "$input" --format picard-insert-size \
              > "$root/$id/insert/aligngauge.txt"
            python3 tools/reference/picard/compare-insert-size.py \
              "$root/$id/insert/reference/metrics.txt" \
              "$root/$id/insert/aligngauge.txt" \
              "$root/$id/insert/differential.json"
          done
      - name: Show differential reports
        if: always()
        run: |
          find "$RUNNER_TEMP/m11-oracle" -type f \( -name 'differential.json' -o -name 'metrics.txt' -o -name 'aligngauge.txt' -o -name 'output_state.txt' \) -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
