name: V0.5 ASan Corrupt Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/v0.5-asan-corrupt-diagnostic.yml"
      - "crates/aligngauge-hts/tests/asan_corrupt_isolation.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    name: diagnostic/v0.5-asan-corrupt
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install AddressSanitizer target
        run: rustup target add x86_64-unknown-linux-gnuasan

      - name: Isolate corrupt fixture leaks
        shell: bash
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNUASAN_LINKER: cc
          CC_x86_64_unknown_linux_gnuasan: cc
          CXX_x86_64_unknown_linux_gnuasan: c++
          CFLAGS_x86_64_unknown_linux_gnuasan: -fsanitize=address -fno-omit-frame-pointer
          CXXFLAGS_x86_64_unknown_linux_gnuasan: -fsanitize=address -fno-omit-frame-pointer
          CARGO_TARGET_DIR: target/v0.5-asan-corrupt
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=0
        run: |
          set -euo pipefail
          mkdir -p target/v0.5-asan-corrupt/logs
          tests=(
            coordinate_regression_is_leak_clean
            malformed_optional_tag_is_leak_clean
            malformed_record_length_is_leak_clean
            truncated_bgzf_is_leak_clean
            unknown_reference_id_is_leak_clean
          )
          failed=0
          : > target/v0.5-asan-corrupt/results.tsv
          for test_name in "${tests[@]}"; do
            set +e
            cargo test -p aligngauge-hts \
              --target x86_64-unknown-linux-gnuasan \
              --test asan_corrupt_isolation \
              --locked \
              "$test_name" -- --exact --nocapture \
              >"target/v0.5-asan-corrupt/logs/$test_name.log" 2>&1
            status=$?
            set -e
            printf '%s\t%s\n' "$test_name" "$status" >> target/v0.5-asan-corrupt/results.tsv
            if [[ $status -ne 0 ]]; then
              failed=1
              echo "ASan/LSan failure: $test_name" >&2
              tail -n 100 "target/v0.5-asan-corrupt/logs/$test_name.log" >&2
            fi
          done
          cat target/v0.5-asan-corrupt/results.tsv
          if [[ $failed -ne 0 ]]; then
            exit 1
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v0.5-asan-corrupt-${{ github.sha }}
          path: target/v0.5-asan-corrupt/
          if-no-files-found: error
          retention-days: 7
