name: M10 oracle line diagnostic

on:
  push:
    branches:
      - milestone-10-samtools-stats
    paths:
      - .github/workflows/m10-oracle-line-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Show fixture flags and Samtools order inputs
        run: |
          set -euo pipefail
          source tools/reference/samtools/image.lock
          docker pull "$SAMTOOLS_IMAGE" >/dev/null
          docker run --rm --network none -v "$PWD:/work:ro" -w /work "$SAMTOOLS_IMAGE" \
            samtools view testdata/fixtures/flags_and_pairs.bam \
            | awk 'BEGIN{OFS="\t"} {f=$2; paired=and(f,1)!=0; r1=and(f,64)!=0; r2=and(f,128)!=0; sec=and(f,256)!=0; supp=and(f,2048)!=0; print NR,$1,f,paired,r1,r2,sec,supp}'
